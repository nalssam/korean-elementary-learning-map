# 수업 자료(lessons/)의 CI. lessons/ 가 바뀔 때만 돈다 (lessons/docs/CONTRACT.md 0·12절).
# 검사 → 시험 → 형식 검사 → 초안까지 싣는 미리 보기 빌드. 미리 보기는 내려받아 볼 수 있게 올려 둔다.
# 기본 가지에서는 베끼기 검사 기록이 없으면 실패한다 (--push, 13절). PR 에서는 알림으로만 보인다.
#
# 도는 때: PR, 기본 가지(main)에 올린 때, 손으로 돌린 때. PR 가지에 올리면 PR 쪽에서 한 번만 돈다.
name: lessons-ci

on:
  pull_request:
    paths:
      - "lessons/**"
      - ".github/workflows/lessons-ci.yml"
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - ".github/workflows/lessons-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lessons-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lessons

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # 시험이 python-pptx 와 Chromium 을 건너뛰지 않게 한다 (CI 에서는 건너뛴 시험이 없어야 한다. 16절)
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          # 기준 가지와 견주는 검사(--base)가 기준 커밋을 읽는다
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: lessons/.nvmrc
          cache: npm
          cache-dependency-path: lessons/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PPTX 를 PDF 로 찍어 보는 넘침 시험이 LibreOffice 와 pdftotext 를 쓴다. 없으면 그 시험이 건너뛰어진다.
      # Pretendard 는 LibreOffice 가 글 폭을 PowerPoint 와 같게 재도록 이 컴퓨터에만 깐다 (사이트에는 npm 패키지에서 싣는다).
      - name: 내려받기
        run: |
          npm ci
          python -m pip install -r generators/pptx/requirements.txt
          npx playwright install --with-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-impress poppler-utils
          mkdir -p ~/.fonts
          cp node_modules/pretendard/dist/public/static/*.otf ~/.fonts/
          fc-cache -f ~/.fonts

      # 만든 PDF·PPTX 와 그림의 캐시. 입력의 sha256 이 같을 때만 복사해 쓰므로 앞 실행의 것을 받아 와도 틀린 파일이 섞이지 않는다 (10절).
      - name: 산출물 캐시 받기
        uses: actions/cache@v4
        with:
          path: |
            lessons/.cache/files
            lessons/.cache/media
            lessons/.cache/lessons.json
          key: lessons-out-${{ runner.os }}-${{ hashFiles('lessons/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            lessons-out-${{ runner.os }}-${{ hashFiles('lessons/package-lock.json') }}-

      - name: 명세 검사
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            npm run check -- --base "origin/$BASE_REF"
          elif [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            # 기본 가지: 베끼기 검사 기록이 있어야 한다. 이번 push 앞의 커밋과 견주어 corrections 를 본다.
            # 강제로 올린 뒤에는 앞의 커밋이 없을 수 있다. 그때는 견주지 않고 --push 만 본다.
            if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              npm run check -- --push --base "$BEFORE"
            else
              if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
                echo "::notice::앞의 커밋($BEFORE)을 찾을 수 없어(강제로 올린 것) 공개된 차시의 corrections 는 견주지 않습니다."
              fi
              npm run check -- --push
            fi
          else
            npm run check
          fi

      # 건너뛴 시험이 하나라도 있으면 실패한다 (16절). 건너뛴 까닭은 위의 시험 기록에 적혀 있다.
      - name: 시험
        run: |
          npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/test-results.tap"
          if ! grep -qx '# skipped 0' "$RUNNER_TEMP/test-results.tap"; then
            echo "::error::건너뛴 시험이 있습니다. CI 에서는 모든 시험이 돌아야 합니다 (CONTRACT 16절). 건너뛴 시험과 까닭:"
            grep -E '# SKIP' "$RUNNER_TEMP/test-results.tap" || true
            exit 1
          fi
          echo "건너뛴 시험: 0"

      - name: 형식 검사
        run: npm run typecheck

      - name: 미리 보기 빌드 (초안 포함)
        env:
          SHOW_DRAFTS: "1"
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: npm run build

      - name: 미리 보기 올리기
        uses: actions/upload-artifact@v4
        with:
          name: lessons-preview
          path: lessons/dist
          retention-days: 14
