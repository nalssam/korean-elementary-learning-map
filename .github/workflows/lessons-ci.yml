# 수업 자료(lessons/)의 CI. lessons/ 가 바뀔 때만 돈다 (lessons/docs/CONTRACT.md 0절).
# 검사 → 시험 → 형식 검사 → 초안까지 싣는 미리 보기 빌드. 미리 보기는 내려받아 볼 수 있게 올려 둔다.
# 기본 가지에서는 베끼기 검사 기록이 없으면 실패한다 (--push, 13절). PR 에서는 알림으로만 보인다.
name: lessons-ci

on:
  pull_request:
    paths:
      - "lessons/**"
      - ".github/workflows/lessons-ci.yml"
  push:
    paths:
      - "lessons/**"
      - ".github/workflows/lessons-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lessons-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lessons

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # 시험이 python-pptx 와 Chromium 을 건너뛰지 않게 한다 (CI 에서는 건너뛴 시험이 없어야 한다. 16절)
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          # 기준 가지와 견주는 검사(--base)가 기준 커밋을 읽는다
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: lessons/.nvmrc
          cache: npm
          cache-dependency-path: lessons/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 내려받기
        run: |
          npm ci
          python -m pip install -r generators/pptx/requirements.txt
          npx playwright install --with-deps chromium

      - name: 명세 검사
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            npm run check -- --base "origin/$BASE_REF"
          elif [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            # 기본 가지: 베끼기 검사 기록이 있어야 한다. 이번 push 앞의 커밋과 견주어 corrections 를 본다.
            if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
              npm run check -- --push --base "$BEFORE"
            else
              npm run check -- --push
            fi
          else
            npm run check
          fi

      - name: 시험
        run: npm test

      - name: 형식 검사
        run: npm run typecheck

      - name: 미리 보기 빌드 (초안 포함)
        env:
          SHOW_DRAFTS: "1"
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: npm run build

      - name: 미리 보기 올리기
        uses: actions/upload-artifact@v4
        with:
          name: lessons-preview
          path: lessons/dist
          retention-days: 14
