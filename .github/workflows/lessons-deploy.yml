# 수업 자료(lessons/) 사이트를 GitHub Pages 에 배포한다 (lessons/docs/CONTRACT.md 12절).
# 기본 가지(main)에서만 돈다. 공개된 차시만 싣는 공개 빌드이고, 배포는 승인자가 날쌤인 production 환경을 거친다.
#
# 저장소 변수(Settings → Secrets and variables → Actions → Variables):
#   SITE_URL   배포 주소. 하위 경로 없이 (예: https://nalssam.github.io). 없으면 배포를 건너뛴다 (실패하지 않는다).
#   SITE_BASE  하위 경로 (예: /korean-elementary-learning-map). 적지 않아도 된다. 빌드는 Pages 가 실제로 내주는 경로
#              (configure-pages 의 base_path)를 쓴다. 적어 두면 둘이 같은지 보고, 다르면 멈춘다 (종이의 QR 에 박히는 주소다).
name: lessons-deploy

on:
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - ".github/workflows/lessons-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# 배포는 하나씩, 도중에 끊지 않는다
concurrency:
  group: lessons-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: lessons

jobs:
  # SITE_URL 이 아직 없으면 배포하지 않고, 까닭을 실행 요약에 한 줄 남긴다 (실패로 치지 않는다)
  skipped:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.SITE_URL == ''
    runs-on: ubuntu-24.04
    steps:
      - name: 배포를 건너뛴 까닭
        working-directory: .
        run: |
          echo "저장소 변수 SITE_URL 이 없어 배포를 건너뛰었습니다. 종이에 박히는 QR 주소가 이 값에서 나옵니다. Settings → Secrets and variables → Actions → Variables 에 SITE_URL(예: https://nalssam.github.io)을 넣으면 다음 push 부터 배포합니다." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::SITE_URL 이 없어 배포를 건너뛰었습니다."

  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      # configure-pages 가 Pages 의 하위 경로를 읽는다
      pages: read
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      # 빌드보다 먼저: 사이트의 하위 경로(SITE_BASE)를 Pages 에서 받아 온다
      - id: pages
        uses: actions/configure-pages@v5

      - name: 하위 경로 정하기
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          VAR_BASE: ${{ vars.SITE_BASE }}
        run: |
          if [ -n "$VAR_BASE" ] && [ "${VAR_BASE%/}" != "${PAGES_BASE%/}" ]; then
            echo "::error::저장소 변수 SITE_BASE($VAR_BASE)와 Pages 가 내주는 하위 경로($PAGES_BASE)가 다릅니다. 이대로 배포하면 종이의 QR 주소가 열리지 않습니다. 둘 가운데 맞는 쪽으로 고칩니다."
            exit 1
          fi
          echo "SITE_BASE=$PAGES_BASE" >> "$GITHUB_ENV"
          echo "하위 경로: ${PAGES_BASE:-(없음)}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: lessons/.nvmrc
          cache: npm
          cache-dependency-path: lessons/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 내려받기
        run: |
          npm ci
          python -m pip install -r generators/pptx/requirements.txt
          npx playwright install --with-deps chromium

      # 만든 PDF·PPTX 와 그림의 캐시. 입력의 sha256 이 같을 때만 복사해 쓴다 (10절). CI 와 같은 열쇠를 쓴다.
      - name: 산출물 캐시 받기
        uses: actions/cache@v4
        with:
          path: |
            lessons/.cache/files
            lessons/.cache/media
            lessons/.cache/lessons.json
          key: lessons-out-${{ runner.os }}-${{ hashFiles('lessons/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            lessons-out-${{ runner.os }}-${{ hashFiles('lessons/package-lock.json') }}-

      # 배포 워크플로도 기본 가지의 검사를 먼저 돌린다. 베끼기 검사 기록이 없거나 낡았으면 배포하지 않는다 (13절).
      - name: 명세 검사
        run: npm run check -- --push

      - name: 공개 빌드
        run: npm run build

      - name: 배포 요약
        run: node checks/deploy-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lessons/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      # 승인자가 날쌤인 환경. Settings → Environments → production 에서 Required reviewers 를 날쌤으로 둔다.
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
