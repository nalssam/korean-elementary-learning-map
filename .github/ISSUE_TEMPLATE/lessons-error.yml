name: 수업 자료 오류 제보
description: 초등 사회 수업 자료(lessons/)에서 틀린 내용, 깨진 화면, 어색한 문장을 알려 주세요.
title: "[오류] "
labels: ["lessons"]
body:
  - type: markdown
    attributes:
      value: |
        알려 주셔서 고맙습니다. 이 글은 누구나 볼 수 있습니다. 아이 이름·얼굴, 학교 이름, 연락처는 적지 마세요.
  - type: input
    id: lesson
    attributes:
      label: 차시
      description: 안내 페이지 주소의 끝부분입니다. 모르면 학년·학기·단원·차시를 적어 주세요.
      placeholder: 5-2/1/01
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 어디에서 보았나요
      multiple: true
      options:
        - 차시 안내 페이지
        - 수업 화면
        - 수업 화면 PPTX
        - 학습지
        - 카드
        - 컬러링 도안
        - 페이퍼크래프트
        - 확인 퀴즈
        - 웹 활동
        - 그 밖의 곳
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 틀렸나요
      description: 틀린 글이나 화면, 그리고 어떻게 고치면 좋을지 적어 주세요. 화면을 찍은 그림을 붙여도 됩니다.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 근거
      description: 사실이 틀렸다면 확인할 수 있는 공개 자료의 주소를 적어 주세요. 교과서 문장은 옮겨 적지 않고 "교과서 8쪽"처럼 쪽수로만 적어 주세요.
    validations:
      required: false
