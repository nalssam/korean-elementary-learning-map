# 차시 명세 본보기입니다. 새 차시를 만들 때 이 파일을 content/<학기>/<단원>/<묶음>/lesson.yaml 로 복사해 고칩니다.
# 칸마다 윗줄에 주석(# 로 시작하는 줄)을 달았습니다. 다 쓴 칸의 주석은 지워도 됩니다.
# 값 뒤에 " #" 을 붙여 주석을 달지 않습니다. 글이 거기에서 잘립니다. 주석은 늘 윗줄에 씁니다.
# 글에 "콜론+빈칸"이 들어가거나 글이 따옴표로 시작하면 글 전체를 큰따옴표로 감쌉니다.
# 차시 번호·쪽수·단원명·성취기준은 차시표(content/registry.yaml)에만 적습니다. 여기에 다시 적지 않습니다.
# 교과서 문장·활동·예시 답을 옮기지 않습니다. 주석에도 적지 않습니다.

# 형식의 판. 늘 1 입니다.
schema_version: 1
# 이 명세의 id: 학기/단원/묶음. 파일이 놓인 폴더와 같아야 합니다. 복사한 뒤 꼭 고칩니다.
id: 5-2/1/01
# 우리가 붙인 차시 이름 (30자까지). 교과서의 차시 제목을 옮기지 않습니다.
title: 차시 이름을 적습니다
# 교사에게 건네는 한두 문장 소개 (120자까지). 안내 페이지 맨 위에 보입니다.
tagline: 이 시간에 아이들이 무엇을 하는지 한두 문장으로 씁니다.
# draft(초안) 또는 published(공개). published 는 날쌤만 적습니다.
status: draft
# 검수 기록. 손으로 적지 않습니다. npm run sign 과 npm run check:originality -- <id> --record 가 여기에 적습니다.
reviews: []
# 공개한 뒤에 사실을 고치면 날짜와 고친 내용을 적습니다. 안내 페이지에 보입니다. 처음에는 비워 둡니다.
corrections: []

# 이 시간에 닿을 곳 1~3개. "~한다"로 씁니다.
objectives:
  - 아이들이 이 시간에 할 수 있게 되는 것을 씁니다.

# 인쇄물과 그 준비물 말고 더 챙길 것. 학습지·가위·풀은 인쇄 안내에서 모아 보여 주므로 여기에 적지 않습니다.
prepare:
  # item 은 챙길 것, qty 는 얼마나 (적지 않아도 됩니다)
  - item: 챙길 것
    qty: 모둠마다 1개

# 다루는 내용의 무게
sensitivity:
  # none 제한 없음 · care 전쟁·차별 등을 다룸(점수·순위·시간 재기 없음) · no_play 피해가 중심(놀이 자료를 만들지 않음)
  level: none
  # 교사에게 남기는 한 줄 (적지 않아도 됩니다)
  note: 무게가 있는 차시에서 수업할 때 조심할 점을 씁니다.

# 이 차시에서 처음 가르치는 낱말
terms:
  # 낱말 장(term)과 뒷면을 적지 않은 카드가 이 풀이를 씁니다
  new:
    # term 은 낱말(14자까지), meaning 은 아이 눈높이 풀이(50자까지), facts 는 풀이의 근거가 되는 사실 id
    - term: 새 낱말
      meaning: 아이가 알아듣는 말로 쓴 풀이입니다
      facts: [f1]

# 이 차시의 사실. 맞고 틀림이 있는 글(퀴즈·카드·낱말 풀이)은 반드시 여기의 사실을 가리킵니다.
facts:
  # id 는 f1, f2 … 처럼 씁니다
  - id: f1
    # 우리 말로 쓴 한 문장. 둘이면 사실을 나누어 적습니다. 수업 방법에 관한 말은 넣지 않습니다.
    claim: 새 낱말의 뜻을 우리 말로 쓴 한 문장이다.
    # 공개 출처. 초안에서는 비워 둘 수 있고, 공개하려면 하나 이상 있어야 합니다.
    sources:
      # name 은 기관·자료 이름입니다. 교과서와 교과서 회사 자료, 위키백과, 블로그, 영상은 쓰지 않습니다.
      - name: 출처 기관 이름
        # 문서나 소장품의 제목
        title: 문서 제목
        # 누구나 열어 볼 수 있는 주소
        url: https://www.example.org/
        # 출처에서 근거가 되는 구절을 그대로 짧게 (160자까지). 공개하려면 사실마다 하나는 있어야 합니다.
        quote: 출처에 적힌 근거 구절을 짧게 옮깁니다.
        # 주소를 열어 확인한 날
        accessed: "2026-11-19"
    # 죽음·폭력·강제 동원처럼 사람이 겪은 피해를 담은 사실이면 true. 퀴즈·카드·웹 활동이 가리킬 수 없습니다.
    painful: false
    # 사실 확인 기록. 손으로 적지 않습니다. npm run sign -- <id> check f1 --by "별명" 이 적습니다.
    checks: []
  - id: f2
    claim: 그림이 보여 주는 생김새를 우리 말로 쓴 한 문장이다.
  - id: f3
    claim: 읽기 자료가 기대는 사실을 우리 말로 쓴 한 문장이다.

# 그림과 사진. 파일은 이 묶음 폴더의 media/ 에 넣습니다 (1MB 이하).
media:
  # id 는 영문 소문자·숫자·하이픈. 다른 칸에서 이 id 로 가리킵니다.
  - id: example-diagram
    # photo 사진 · drawing 그림 · diagram 도해 · map 지도
    kind: diagram
    # 묶음 폴더 기준 경로 (svg·png·jpg). 직접 그린 그림은 SVG 로 둡니다.
    file: media/example-diagram.svg
    # 그림을 못 보는 사람에게 읽어 줄 설명. 수업에서 아직 알려 주지 않은 이름은 적지 않습니다.
    alt: 그림에 무엇이 어떻게 놓여 있는지 쓴 설명
    # 그림 아래에 찍는 한 줄 (40자까지)
    caption: 그림 아래 한 줄
    # 원본의 권리 정보. 화면에 찍는 출처 표시는 여기에서 저절로 만들어집니다.
    credit:
      # 원본을 만든 이나 소장처. 직접 만든 것은 "몽당분필 날쌤"처럼 씁니다.
      holder: 몽당분필 날쌤
      # 이용 조건. 직접 만든 것은 original, 남의 것은 PD·CC0·KOGL-1·CC-BY·CC-BY-SA 가운데 하나 (원본에 적힌 조건)
      licence: original
    # 원본에 한 일: none 그대로 · cropped 일부를 잘랐다 · traced 본떠 새로 그렸다
    change: none
    # 생성형 AI 로 만든 그림이면 true. 사실을 전달하는 그림에는 쓰지 않습니다.
    ai_generated: false
    # 실제 있었던 것을 보여 주면 true. 지어낸 장면만 false 입니다.
    factual: true
    # 알아볼 수 있는 실제 사람이 나오면 true (credit.note 에 초상 확인을 적습니다)
    person: false
    # 직접 그린 사실 그림이 근거로 삼은 사실
    facts: [f2]
  # 남의 사진은 이렇게 적습니다. 원본 페이지에서 이용 조건을 확인한 뒤에 넣습니다.
  # 같은 그림을 공공누리 제1유형이나 퍼블릭 도메인으로 구할 수 있으면 그쪽을 씁니다. CC BY-SA 그림은 자르거나 본뜨지 않고 그대로 씁니다 (change: none).
  # 제목(title)은 원본 페이지에 적힌 작품·소장품 이름입니다. 파일 이름(예: 사진 0154.jpg)을 적지 않습니다.
  - id: example-photo
    kind: photo
    file: media/example-photo.jpg
    alt: 사진에 보이는 것을 쓴 설명
    credit:
      holder: 소장 기관 이름
      # 원본의 제목·소장품 이름 (남의 자료는 꼭 적습니다)
      title: 소장품 이름
      # 원본이 실린 주소 (남의 자료는 꼭 적습니다)
      source_url: https://www.example.org/
      licence: KOGL-1
      # 원본 페이지에서 이용 조건을 확인한 날 (남의 자료는 꼭 적습니다)
      checked: "2026-11-19"
      # 허락 범위, 저작권이 없다고 본 까닭, 초상 확인 같은 메모 (필요할 때만)
      note: 원본 페이지에서 공공누리 제1유형 표시를 확인했습니다.

# 읽기 자료. 수업 화면의 passage 장과 학습지의 passage 블록이 같은 글을 가리킵니다.
passages:
  # id 는 영문 소문자·숫자·하이픈
  - id: example-reading
    # 제목 (30자까지)
    title: 읽기 자료의 제목
    # 문단 (6개까지, 문단마다 120자까지). 수업 화면에 띄우는 글은 문단 4개, 모두 300자까지입니다.
    text:
      - 옛 기록이나 자료의 내용을 아이가 읽을 수 있는 말로 풀어 씁니다.
      - 문단 하나에 한 가지 이야기만 담습니다.
    # 글 아래에 그대로 찍는 한 줄. 무엇을 풀어 썼는지 밝힙니다. 교과서를 줄였다고 적는 자리가 아닙니다.
    source: 옛 기록에 전하는 이야기를 쉬운 말로 풀어 썼습니다.
    # 이 글이 기대는 사실
    facts: [f3]

# 수업 흐름. 차시 안에서 도입 → 전개 → 정리 순서이고 시간 합은 40분입니다.
flow:
  # 두 차시 묶음에서는 단계마다 lesson 에 몇 차시인지 적습니다. 한 차시 묶음에서는 적지 않습니다.
  # phase 는 도입·전개·정리 가운데 하나
  - phase: 도입
    # 이 단계에 쓰는 시간(분)
    minutes: 5
    # 이 단계에서 하는 일 한 줄 (40자까지)
    title: 그림을 보고 궁금한 것 말하기
    # 교사가 하는 일을 순서대로. 문장마다 한 가지 동작.
    do:
      - 그림을 띄웁니다.
    # 발문과, 아이들 말에서 귀 기울일 것. 예시 답을 정답처럼 적지 않습니다.
    ask:
      # q 는 발문, listen_for 는 들어 볼 것
      - q: 무엇이 보이나요?
        listen_for: 본 것과 짐작한 것을 나누어 말하는지 듣습니다.
    # 이 단계에서 쓰는 자료: slides, worksheet, quiz, cards, web_activity 등
    uses: [slides]
    # 쓰는 수업 화면 [첫 장, 끝 장]. 1번부터 빈틈없이 이어지고 모든 장을 덮습니다.
    slides: [1, 3]
    # 교사에게 건네는 도움말 한 줄 (적지 않아도 됩니다)
    tip: 아이들이 말한 것을 칠판에 둘로 나누어 적습니다.
    # 이 단계가 기대는 사실 (적지 않아도 됩니다)
    facts: [f2]
  - phase: 전개
    minutes: 28
    title: 자료를 읽고 학습지 풀기
    do:
      - 읽기 자료를 함께 읽습니다.
      - 학습지를 나누어 줍니다.
    uses: [slides, worksheet, cards]
    slides: [4, 9]
  - phase: 정리
    minutes: 7
    title: 확인 퀴즈와 마무리
    do:
      - 확인 퀴즈를 풉니다.
    uses: [slides, quiz, web_activity]
    slides: [10, 11]

# 수업 화면. 한 장에 한 가지만 담습니다. 한 차시에 24장까지. 첫 장은 늘 표지(title)입니다.
# 모든 장에 notes(교사 메모, 화면에는 보이지 않음)와 facts(이 장이 기대는 사실)를 적을 수 있습니다.
slides:
  # 표지: title 30자, subtitle 40자
  - layout: title
    title: 차시 이름을 적습니다
    subtitle: 부제를 적습니다
    # 교사용 진행 메모. 비우면 이 장을 쓰는 흐름 단계의 title·do·ask 가 메모로 들어갑니다.
    notes: 표지를 띄우고 오늘 할 일을 짧게 말합니다.
  # 큰 질문 하나: kicker 12자, title 40자, hint 40자, media 는 곁그림(지어낸 그림도 됩니다)
  # 글과 그림 한 장을 함께 싣는 장(question·points·term·activity)은 글이 왼쪽, 그림이 오른쪽 단을 가득 채웁니다. 글이 짧을수록 그림이 커집니다.
  - layout: question
    kicker: 오늘의 질문
    title: 이 그림에서 무엇을 알아낼 수 있을까요?
    hint: 본 것부터 말해 봅시다.
    media: example-diagram
  # 그림 한 장을 크게: title 30자, media 는 보고 읽어 내는 그림, caption 40자. facts 는 이 장이 기대는 사실
  - layout: picture
    title: 자세히 봅시다
    media: example-photo
    caption: 눈에 띄는 것을 찾아봅시다.
    facts: [f2]
  # 짧은 항목: points 2~4개 (항목마다 40자까지)
  - layout: points
    title: 오늘 알아볼 것
    points:
      - 그림에서 본 것
      - 본 것으로 짐작한 것
  # 둘을 나란히 견주기: left·right 마다 label(12자)과 points(30자, 4개까지)를 적습니다.
  # 그림은 둘 가운데 한 가지로 싣습니다. 두 쪽이 함께 보는 그림 한 장은 아래처럼 장의 media 에, 쪽마다 한 장씩이면 left.media·right.media 에 적습니다. 둘을 섞으면 검사가 실패합니다.
  - layout: compare
    title: 둘을 견주어 봅시다
    media: example-diagram
    left:
      label: 왼쪽 이름표
      points: [왼쪽의 특징]
    right:
      label: 오른쪽 이름표
      points: [오른쪽의 특징]
  # 차례가 있는 단계: steps 2~5개. 단계마다 label 6자, text 40자, media(그림)
  # 그림이 셋이면 한 줄로, 넷이면 2 × 2 로 화면을 채웁니다. 작게 놓여도 알아볼 수 있는 그림을 고릅니다.
  # 직접 그리는 단계 그림은 가로로 넓게(2.6:1 남짓, viewBox 0 0 780 300) 그립니다. 2:1 보다 좁으면 npm run check 가 알림으로 알려 줍니다. 사진은 그대로 둡니다.
  - layout: steps
    title: 차례대로 봅시다
    steps:
      - label: 처음
        text: 처음에 한 일
      - label: 다음
        text: 다음에 한 일
  # 새 낱말 하나: term 은 terms.new 에 적은 낱말입니다. 풀이는 거기에서 가져옵니다. example 은 쓰임 예(60자까지).
  - layout: term
    term: 새 낱말
    example: 새 낱말을 넣어 만든 짧은 문장입니다.
  # 읽기 자료 한 편: passage 에 passages 의 id 를 적습니다
  - layout: passage
    passage: example-reading
    facts: [f3]
  # 활동 안내: instructions 1~5줄(40자까지), minutes 걸리는 시간, materials 준비물(12자까지)
  - layout: activity
    title: 학습지를 풀어 봅시다
    instructions:
      - 그림을 보고 본 것을 적습니다.
      - 본 것으로 짐작한 것을 적습니다.
    minutes: 10
    materials: [학습지, 연필]
  # 퀴즈 문항 하나: item 은 quiz.items 의 순서 번호(1부터). 답은 다음 키에 드러납니다.
  - layout: quiz
    item: 1
  # 마무리: points 3개까지
  - layout: closing
    title: 오늘 알게 된 것을 말해 봅시다
    points:
      - 본 것과 짐작한 것은 다릅니다.

# 학습지. 쪽마다 블록을 위에서 아래로 놓습니다.
worksheet:
  # 제목 30자, 부제 40자
  title: 학습지 제목
  subtitle: 학습지 부제
  # 인쇄 안내
  print:
    # 누구에게 한 부씩: student 학생 · pair 짝 · group 모둠 · class 학급
    per: student
    # 단면 single · 양면 duplex (적지 않으면 단면)
    sides: single
    # 세로 portrait · 가로 landscape (적지 않으면 세로)
    orientation: portrait
    # 흑백으로 뽑아도 되는가 (적지 않으면 true)
    bw_ok: true
    # 권하는 종이 (적지 않으면 A4 보통 용지)
    paper: A4 보통 용지
    # 이 인쇄물을 쓸 때 필요한 준비물
    materials: [연필]
    # 인쇄할 때 주의할 점 한 줄
    note: 그림이 잘 보이게 진하게 뽑습니다.
  # 쪽 목록 (4쪽까지). 쪽수는 이 목록의 길이입니다.
  pages:
    # heading 은 쪽 머리의 한 줄(30자까지), blocks 는 그 쪽에 놓을 것
    - heading: 그림 보고 짐작하기
      blocks:
        # 그림: media 는 그림 id, width 는 full·half·third, show_caption 은 그림 아래 한 줄을 찍을지
        # 그림 여럿을 columns 로 나란히 놓으면 높이를 맞춰 찍습니다. 설명이 한 줄에 들어가게 짧게 쓰고, 출처가 같으면 줄 아래에 한 번만 찍힙니다.
        - type: figure
          media: example-diagram
          width: half
          show_caption: true
        # 풀어 놓은 보기: 아이가 할 일을 한 번 먼저 보여 줍니다. "예" 표시가 붙은 조용한 상자로 찍히고 번호는 붙지 않습니다.
        # 한 문장이면 text 에 적고, 본 것 → 아는 것 → 짐작처럼 이어지면 parts 에 칸 2~4개를 적습니다. 둘 가운데 하나만 씁니다.
        - type: example
          # 칸마다 label 은 이름표(12자까지), text 는 그 칸의 글(60자까지). 찍을 때 한 줄에 화살표로 잇습니다.
          parts:
            - label: 본 것
              text: 그림 속 그릇에 손잡이가 있다.
            - label: 아는 것
              text: 손잡이는 손으로 쥐는 곳이다.
            - label: 짐작
              text: 손에 들고 썼을 것이다.
        # 지시문·질문: text 는 글, number 가 true 면 번호가 붙습니다.
        - type: prompt
          text: 그림에서 본 것을 적어 봅시다.
          number: true
        # 줄 쓰기 칸: label 은 칸 위의 한 줄, count 는 줄 수(12줄까지)
        - type: lines
          label: 본 것
          count: 3
        # 본 것 → 짐작한 것 → 까닭 세 칸: target 은 살펴볼 것, media 는 그림, lines 는 칸마다 줄 수
        # observe_label·infer_label·reason_label 은 세 칸의 이름입니다 (적지 않으면 아래와 같은 기본 이름)
        - type: observe_infer
          target: 그림
          media: example-diagram
          lines: 3
          observe_label: 눈으로 본 것
          infer_label: 짐작한 것
          reason_label: 그렇게 짐작한 까닭
        # 문장 틀: frame 에 문장을 적고 빈칸은 밑줄 세 개(___)로 적습니다.
        - type: sentence_frame
          frame: 나는 ___을 보고 ___라고 짐작했다.
    - heading: 읽고 정리하기
      blocks:
        # 읽기 자료 한 편: passage 에 passages 의 id 를 적습니다
        - type: passage
          passage: example-reading
        # 아이가 읽는 짧은 글: title 은 제목, text 는 1~6줄, source 는 출처 한 줄, facts 는 기대는 사실
        - type: note
          title: 낱말 풀이
          text:
            - 새 낱말은 아이가 알아듣는 말로 풉니다.
          facts: [f1]
        # 나란히 놓기: columns 에 단(2~4개)마다 블록 목록을 적습니다. 단 안에 다시 단을 넣을 수 없습니다.
        - type: columns
          columns:
            # 빈 칸 (그림 그리기·자유롭게 쓰기): label 은 칸 위의 한 줄, height_mm 는 칸의 높이(15~200)
            - - type: box
                label: 그려 봅시다
                height_mm: 40
            # 선 잇기: pairs 에 맞는 짝끼리 적습니다 (left 20자, right 30자). 찍을 때 오른쪽만 섞습니다.
            - - type: match
                pairs:
                  - left: 낱말 하나
                    right: 그 낱말의 짧은 풀이
                  - left: 낱말 둘
                    right: 다른 낱말의 짧은 풀이
        # 표: columns 는 칸 이름, rows 는 줄. 빈 글("")은 아이가 채우는 칸입니다.
        - type: table
          columns: [본 것, 짐작한 것]
          rows:
            - [그림의 생김새, ""]
        # 연표: points 2~8개. when(14자)은 늘 찍히고 what(30자)은 일어난 일입니다. blank 가 true 인 칸의 what 은 비워 두어 아이가 채웁니다. 연도는 그 칸의 facts 가 가리킨 사실에 있어야 합니다.
        - type: timeline
          points:
            - when: 먼저
              what: 먼저 있었던 일
              blank: false
            - when: 나중
              what: 나중에 있었던 일
              blank: true
        # 확인 퀴즈의 문항을 그대로 찍습니다: items 는 quiz.items 의 순서 번호
        - type: quiz
          items: [2]
  # 교사용 풀이: 정해진 답이 없는 칸에 '이런 답이 나오면 좋다'. 연표·선 잇기·퀴즈의 답은 저절로 나오므로 적지 않습니다.
  guide:
    # where 는 어느 칸인지, text 는 풀이
    - where: 문장 틀
      text: 앞 칸에 그림에서 본 것이 들어 있으면 됩니다.
  # 학습지의 표·지시문·풀이에 실린 사실
  facts: [f2]

# 확인 퀴즈 (3~10문항). 학생이 QR 로 열어 풉니다.
quiz:
  items:
    # OX: q 는 물음(80자까지), answer 는 true 또는 false. O·X 로 적지 않습니다.
    # 단추와 정답 표시(○·×)는 사이트가 찍습니다. 물음에 O·X·○·× 를 손으로 적지 않습니다.
    - type: ox
      q: 새 낱말의 풀이가 맞는지 골라 봅시다.
      answer: true
      # 답을 고른 뒤 아이에게 보여 주는 풀이
      explain: 풀이를 아이가 알아듣는 말로 씁니다.
      # 문항의 근거가 되는 사실 (꼭 하나 이상)
      facts: [f1]
    # 고르기: choices 는 보기 3~4개(30자까지), answer 는 맞는 보기의 순서 번호(1부터)
    - type: choice
      q: 그림에서 볼 수 있는 것은 무엇인가요?
      choices: [첫째 보기, 둘째 보기, 셋째 보기]
      answer: 1
      explain: 그림에서 첫째 보기를 찾을 수 있습니다.
      facts: [f2]
    # 단답: answer 는 답(14자까지), accept 는 함께 맞다고 볼 답. 띄어쓰기와 끝의 문장부호는 빼고 견줍니다.
    # 입니다·이에요·예요·요·이야 같은 끝말도 사이트가 떼고 견주므로, 끝말만 다른 답은 accept 에 적지 않습니다. 뜻이 다른 말(동의어, 줄임말)만 적습니다.
    - type: short
      q: 오늘 새로 배운 낱말은 무엇인가요?
      answer: 새 낱말
      accept: [새낱말]
      explain: 오늘 배운 낱말은 새 낱말입니다.
      facts: [f1]
      # 두 차시 묶음(예: 02-03)에서는 이 문항을 푸는 차시를 "lesson: 2" 처럼 적습니다. 적지 않으면 마지막 차시입니다.
      # 한 차시 묶음에서는 적지 않습니다.

# 차시마다 따져 보는 자료 일곱 가지. state 는 skip(만들지 않음, reason 필수) · planned(만들 예정, idea 필수) · ready(만들었음).
# reason 과 idea 는 제작 기록이라 사이트에 보이지 않습니다.
assets:
  # 페이퍼크래프트: 모양이 배움이 되는 입체물이 있을 때. state 를 ready 로 하면 title·module·pages·print·steps·texts·try_it·reflect·facts 를 적습니다. ready 로 하려면 generators/papercraft/modules/ 에 전개도 모듈이 있어야 합니다.
  # 인쇄한 조각은 모두 steps 어딘가에서 이름으로 부릅니다. 카드의 차례대로 조각을 움직여 보는 모형은 조각을 바닥판에 붙이지 않고, 바닥판에는 놓을 자리만 찍습니다.
  papercraft:
    state: skip
    # 만들지 않는 까닭
    reason: 만들어 볼 입체물이 없는 차시입니다.
  # 컬러링 도안: 이름을 댈 수 있는 실물이 있을 때. 직접 그렸거나 본떠 그린 선 그림 한 쪽 (state: ready)
  coloring:
    state: ready
    # 도안 제목 (30자까지)
    title: 색칠하며 찾아봅시다
    # 도안 그림 (media 의 id)
    media: example-diagram
    # 찾아볼 것. 그림 아래에 짧은 할 일 목록으로 찍힙니다. 두세 줄로 씁니다.
    look_for:
      - 그림에서 가장 큰 부분을 찾아 색칠해 봅시다.
    # 이 도안이 기대는 사실
    facts: [f2]
  # 만들기 세트: 해 보는 것이 보는 것보다 나을 때. 안내 페이지 안에 나옵니다. title 은 30자까지
  making_kit:
    state: ready
    title: 만들어 봅시다
    # in_class 수업 안 · extended 수업 밖(창체·다른 교과 연계)
    when: in_class
    # 걸리는 시간(분). 수업 안에서 하는 만들기에만 적습니다.
    minutes: 15
    # 준비물
    materials: [색종이, 풀]
    # 만드는 순서 (2~8줄)
    steps:
      - 색종이를 반으로 접습니다.
      - 접은 자리를 풀로 붙입니다.
    # 안전 안내 한 줄
    safety: 가위를 쓸 때는 날을 몸 바깥쪽으로 둡니다.
  # 방탈출: 아직 생성기가 없어 state 를 skip 이나 planned 로만 적습니다. skip 이면 reason 에 까닭을 적습니다.
  escape:
    state: skip
    reason: 퀴즈만으로 충분한 차시입니다.
  # 3D·가상 체험: 아직 생성기가 없어 state 를 skip 이나 planned 로만 적습니다.
  virtual3d:
    state: planned
    # 만들 계획 한 줄
    idea: 유적을 돌려 볼 수 있는 3D 모형을 생각해 봅니다.
  # 웹 활동: 설치 없이 여는 짧은 활동 (state: ready). activity 의 kind 는 sort(분류하기) · match(짝 맞추기) · order(차례 맞추기) · place(그림 위에 이름표 놓기)
  web_activity:
    state: ready
    # 활동 제목 (30자까지)
    title: 알맞은 상자에 넣어 봅시다
    # 아이에게 보여 주는 안내 (60자까지)
    instructions: 낱말 카드를 끌어 알맞은 상자에 넣어 봅시다.
    activity:
      # 분류하기
      kind: sort
      # 상자: bins 2~4개. id 는 영문, label 은 상자 이름(10자까지)
      bins:
        - id: seen
          label: 본 것
        - id: guessed
          label: 짐작한 것
      # 카드: items 4~12장. text 20자, bin 은 들어갈 상자 id, why 는 맞힌 뒤 보여 주는 까닭
      # media 는 카드에 넣는 그림(적지 않아도 됩니다). 휴대폰에서 작게 보여도 알아볼 그림을 고릅니다. 출처는 활동 아래에 한 번 모아 찍힙니다.
      items:
        - text: 생김새
          bin: seen
          media: example-diagram
          why: 눈으로 볼 수 있습니다.
        - text: 크기
          bin: seen
        - text: 쓰임새
          bin: guessed
        - text: 만든 사람
          bin: guessed
      # 이 활동의 정답이 기대는 사실
      facts: [f2]
  # 카드: A4 한 면에 8장, 늘 양면으로 찍습니다 (state: ready). title 은 30자까지
  cards:
    state: ready
    title: 낱말 카드
    # 이 묶음에서 새로 보태는 카드 (4장 이상)
    cards:
      # front 는 앞면(14자까지). back 을 적지 않으면 terms.new 에서 같은 낱말의 풀이를 씁니다. facts 는 카드의 근거 사실(꼭 하나 이상)
      - front: 새 낱말
        facts: [f1]
      # back 은 뒷면 한 줄(50자까지), media 는 카드에 넣는 그림
      - front: 생김새
        back: 눈으로 보고 알 수 있는 모양
        media: example-diagram
        facts: [f2]
      - front: 본 것
        back: 눈으로 직접 본 것
        facts: [f2]
      - front: 짐작한 것
        back: 본 것을 근거로 미루어 생각한 것
        facts: [f2]
    # 단원 덱: 단원 정리 묶음에서만 씁니다. 같은 단원 앞 묶음들의 카드를 모읍니다 (label 은 카드 모서리에 찍히는 글자).
    collect: []
    # 놀이 방법. 차시 안내 페이지의 카드 줄 아래에 보입니다.
    games:
      # name 은 놀이 이름(20자까지), how 는 하는 법
      - name: 뜻 듣고 맞히기
        how: 한 사람이 뒷면을 읽으면 나머지가 앞면의 낱말을 맞힙니다.
    # 인쇄 안내 (적지 않으면 모둠마다 1부). per 는 학습지의 print 와 같습니다
    print:
      per: group

# 예상되는 오개념과 받아 주는 말
misconceptions:
  # belief 는 아이들이 할 법한 생각, response 는 받아 주는 말
  - belief: 아이들이 잘못 알기 쉬운 생각을 씁니다.
    response: 그 생각을 받아 주며 바로잡는 말을 씁니다.

# 평가: 무엇을 어디에서 볼 것인가
assessment:
  # 무엇을 볼 것인가
  look_for: 본 것을 근거로 짐작했는지
  # 어디에서 볼 것인가
  where: 학습지 1쪽 문장 틀

# 접어 두는 교사용 메모
teacher_notes:
  # title 은 메모 제목, body 는 한 줄 이상
  - title: 수업 전에 읽을 것
    body:
      - 교사가 미리 알아 두면 좋은 배경을 씁니다.
