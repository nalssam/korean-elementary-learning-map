        quote: 우리나라 고인돌은 한반도 전 지역에서 발견되며, 약 4만여 기가 분포한 것으로 추산되고 있다.
        accessed: "2026-11-19"
  - id: f5
    claim: 고인돌이 여러 기씩 무리 지어 있는 것을 보고 핏줄로 이어진 집단의 공동 무덤으로 보는 견해도 있다.
    sources:
      - name: 한국민족문화대백과사전 (한국학중앙연구원)
        title: 고인돌
        url: https://encykorea.aks.ac.kr/Article/E0003901
        quote: 또한, 대부분의 고인돌이 무리를 이루고 수 기씩 줄지어 있는 점에서 혈연 집단의 공동 무덤으로 보기도 한다.
        accessed: "2026-11-19"
  - id: f6
