        title: 고인돌
        url: https://encykorea.aks.ac.kr/Article/E0003901
        quote: 둘째, 끌어올리는 방법은 개석식 고인돌이나 받침돌이 낮은 바둑판식 고인돌에서 흙이나 잡석을 쌓고 끌어올리는 방법이다.
        accessed: "2026-11-19"
  - id: f19
    claim: 흙을 쌓아 끌어 올렸다는 짐작은 덮개돌과 받침돌 사이에 눌려 있는 흙 같은 흔적에서 나온다.
    sources:
