flow:
  - phase: 도입
    minutes: 5
    title: 큰 돌 사진을 보고 첫 생각 붙이기
    do:
      - 고인돌 사진을 띄우고 30초 동안 말없이 보게 합니다.
      - 보이는 것을 세 명에게 묻고 칠판 한쪽에 그대로 적습니다.
      - "'누가, 왜, 어떻게 놓았을까?'에 대한 생각을 붙임쪽지에 한 줄씩 적게 합니다."
      - 붙임쪽지는 칠판 다른 쪽에 붙이고 수업 끝까지 둡니다.
    ask:
      - q: 사진에서 무엇이 보이나요?
        listen_for: 돌의 모양, 크기, 놓인 자리처럼 사진에 있는 것을 말하는지 듣습니다. 짐작이 섞여 나와도 이때는 고치지 않습니다.
    uses: [slides]
    slides: [1, 3]
    facts: [f1]
  - phase: 전개
    minutes: 6
    title: 본 것과 짐작한 것 가르기
    do:
      - 고인돌 그림에서 덮개돌과 받침돌의 이름을 알려 줍니다.
      - 학습지 1쪽 첫 표의 네 문장을 '본 것'과 '짐작한 것'으로 가르게 합니다.
      - 칠판에 적어 둔 아이들의 말도 같은 기준으로 둘로 나눕니다.
    ask:
      - q: 그건 사진에 보이나요, 머릿속으로 생각한 것인가요?
        listen_for: 사진을 손가락으로 가리킬 수 있으면 본 것이고, 가리킬 수 없으면 짐작이라는 기준을 아이들이 스스로 쓰는지 봅니다.
    uses: [slides, worksheet]
    slides: [4, 6]
    facts: [f1, f3]
  - phase: 전개
    minutes: 13
    title: 종이 고인돌을 세우며 차례 짐작하기
    do:
      - 무거운 덮개돌을 어떻게 올렸을지 먼저 묻고, 나온 생각을 칠판에 적은 뒤 미리 만들어 둔 조각과 차례 카드를 나누어 줍니다.
      - 받침판의 자리에 굄돌과 막음돌을 세우고 덮개돌을 얹게 합니다. 이때는 풀칠하지 않습니다.
      - 차례 카드 네 장을 모둠이 정한 차례로 놓고, 차례와 까닭을 학습지 1쪽에 적게 합니다. 카드에 없는 방법이 떠오르면 그것도 적게 합니다.
      - 한 모둠에게 차례와 까닭을 발표하게 하고, 한 가지 짐작을 그림으로 보여 주어 모둠의 차례와 견주게 합니다.
      - 박물관 설명으로 '누가, 왜'의 짐작을 하나 보여 줍니다.
      - 오늘 한 일에 추론이라는 이름을 붙여 줍니다.
    ask:
      - q: 무거운 덮개돌을 받침돌 위로 올리려면 무엇이 있어야 했을까요?
        listen_for: 카드를 나누어 주기 전에 묻습니다. 흙, 통나무, 많은 사람 같은 말이 나오면 "왜 그렇게 생각했나요?"를 한 번 더 묻습니다.
      - q: 이 차례를 실제로 본 사람이 있을까요?
        listen_for: 아무도 보지 못했으니 짐작이라는 말이 나오는지 듣습니다. 백과사전도 다른 나라의 사례와 고인돌에 남은 흔적으로 방법을 짐작한다고 덧붙입니다.
    uses: [papercraft, worksheet, slides]
    slides: [7, 11]
    tip: 조각은 수업 전에 오리고 접어 붙여 두어야 이 단계가 시간 안에 끝날 수 있습니다. 모둠 안에서 돌 세우기, 차례 카드, 기록을 한 사람씩 맡게 합니다.
    facts: [f2, f4, f5, f6, f7, f15, f16, f17, f19]
  - phase: 전개
    minutes: 11
    title: 이름 모를 물건 두 점에게 묻기
    do:
      - 그릇 사진과 돌 도구 사진을 차례로 띄웁니다.
      - 홀수 모둠은 그릇, 짝수 모둠은 돌 도구를 맡아 학습지 2쪽의 표를 채우게 합니다.
      - 짝과 바꾸어 읽고 본 것과 짐작이 이어지는지 서로 확인하게 합니다.
      - 그릇 모둠과 돌 도구 모둠이 한 가지씩 말로 들려주게 합니다.
      - 박물관의 짐작을 보여 주고 자기 짐작과 견주게 합니다.
    ask:
      - q: 그릇 아래쪽의 구멍은 왜 뚫었을까요?
        listen_for: 매달려고, 물을 빼려고, 고치려고 같은 여러 짐작이 나올 수 있습니다. 어느 것이든 까닭을 붙였는지만 봅니다.
    uses: [worksheet, slides]
    slides: [12, 15]
    facts: [f8, f9, f10, f11, f12]
  - phase: 정리
    minutes: 5
    title: 유적과 유물, 그리고 이 단원에서 물을 것
    do:
      - 유적과 유물의 뜻을 오늘 본 것에 하나씩 붙여 봅니다.
      - 확인 퀴즈 한 문항을 함께 풉니다.
      - 단원에서 함께 물어볼 질문을 보여 줍니다.
      - 칠판의 붙임쪽지 가운데 하나를 골라 지금 생각과 견주게 합니다.
    uses: [slides, quiz]
    slides: [16, 20]
    facts: [f13, f14, f18]

slides:
  - layout: title
    title: 이 큰 돌, 누가 어떻게?
    subtitle: 옛사람이 남긴 것에게 물어봅시다
    notes: 오늘은 답을 알려 주는 시간이 아니라 묻는 방법을 익히는 시간이라고 먼저 말합니다.
  - layout: picture
    title: 무엇이 보이나요?
    media: dolmen-bugeun
    notes: 30초 동안 말없이 보게 합니다. 이 돌의 이름은 아직 말하지 않습니다.
    facts: [f1]
  - layout: question
    kicker: 첫 생각
    title: 이 큰 돌은 누가, 왜, 어떻게 놓았을까요?
    hint: 떠오른 생각을 붙임쪽지에 한 줄로 적어 봅시다.
    media: dolmen-bugeun
    notes: 붙임쪽지는 칠판에 붙여 두고 정리 때 다시 봅니다. 맞고 틀림을 말하지 않습니다.
  - layout: picture
    title: 이 돌의 이름은 고인돌입니다
    media: dolmen-parts
    caption: 위의 큰 돌은 덮개돌, 아래 돌은 받침돌
    notes: 사진과 그림을 견주며 덮개돌과 받침돌을 손으로 가리키며 읽게 합니다. 무덤이라는 것은 뒤에서 박물관 설명으로 보여 줍니다.
    facts: [f1, f3]
  - layout: points
    title: 본 것일까요, 짐작일까요?
    points:
      - 덮개돌이 받침돌 위에 얹혀 있다.
      - 많은 사람이 힘을 모아 돌을 옮겼다.
      - 덮개돌이 받침돌보다 훨씬 길다.
      - 중요한 사람을 위해 만들었다.
    notes: 한 문장씩 읽고 본 것이면 손바닥, 짐작이면 주먹을 들게 합니다. 학습지 1쪽 첫 표와 같은 문장입니다.
    facts: [f1]
  - layout: compare
    title: 사진에서 가리킬 수 있나요?
    left:
      label: 눈으로 본 것
      points:
        - 덮개돌이 받침돌 위에 얹혀 있다.
        - 덮개돌이 받침돌보다 훨씬 길다.
    right:
      label: 짐작한 것
      points:
        - 많은 사람이 힘을 모아 돌을 옮겼다.
        - 중요한 사람을 위해 만들었다.
    notes: 사진에서 손가락으로 가리킬 수 있으면 본 것, 가리킬 수 없으면 짐작이라는 기준을 정리합니다. 짐작이 나쁜 것이 아니라 까닭이 있어야 한다는 말을 덧붙입니다.
    facts: [f1]
  - layout: activity
    title: 종이 고인돌을 세워 봅시다
    instructions:
      - 받침판의 자리에 굄돌 두 개와 막음돌을 세웁니다.
      - 덮개돌을 그 위에 얹습니다.
      - 차례 카드 네 장을 모둠이 정한 차례로 놓습니다.
      - 차례와 그 까닭을 학습지 1쪽에 적습니다.
    minutes: 6
    notes: 도안의 굄돌은 받침돌과 같은 말입니다. 덮개돌을 손으로 얹는 것과 진짜 큰 돌을 얹는 것이 어떻게 다를지 묻습니다. 흙 경사로와 통나무 조각으로 차례를 직접 해 보게 해도 됩니다. 차례 카드는 정답을 맞히는 놀이가 아니라 까닭을 말하는 연습입니다.
  - layout: question
    kicker: 모둠 발표
    title: 무거운 덮개돌을 어떻게 올렸을까요?
    hint: 모둠이 정한 차례와 그 까닭을 말해 봅시다.
    notes: 한 모둠만 발표합니다. 다른 모둠은 발표를 듣고 "그 까닭이 사진이나 모형에서 보이나요?"를 묻게 합니다. 카드에 없는 방법을 적은 모둠이 있으면 하나 들어 봅니다.
  - layout: steps
    title: 이렇게 올렸다는 짐작이 있습니다
    steps:
      - label: 하나
        text: 받침돌을 세웁니다.
        media: dolmen-step1
      - label: 둘
        text: 받침돌 높이까지 흙이나 잡석을 쌓아 비탈을 만듭니다.
        media: dolmen-step2
      - label: 셋
        text: 통나무를 깔고 덮개돌을 비탈 위로 끌어 올립니다.
        media: dolmen-step3
      - label: 넷
        text: 쌓았던 흙을 걷어 내면 고인돌이 드러납니다.
        media: dolmen-step4
    notes: 제목의 '짐작'을 꼭 읽어 줍니다. 흙을 쌓아 끌어 올리는 방법은 받침돌이 낮은 고인돌에 썼다고 보는 짐작이고, 받침돌이 높은 이런 고인돌은 통나무를 井자로 쌓아 들어 올렸다는 짐작도 있습니다. 모둠의 차례와 같은지, 모둠이 따로 적은 생각은 어디에 들어갈지 묻습니다.
    facts: [f7, f16, f17, f19]
  - layout: points
    title: 박물관의 설명을 봅시다
    points:
      - 고인돌은 옛사람의 무덤으로 알려져 있습니다.
      - 우두머리 같은 중요한 사람을 기억하려고 만들었다고 봅니다.
      - 우리나라에서 찾은 고인돌은 3만 기가 넘습니다.
    media: dolmen-bugeun
    notes: 첫 생각의 '누가, 왜'와 견주게 합니다. 둘째 줄은 박물관의 짐작이고 셋째 줄은 찾아서 센 기록입니다. 이렇게 많으니 모두 우두머리의 것이었을지 물어볼 수 있습니다. 여러 기씩 무리 지어 있어 집안 사람들의 공동 무덤으로 보는 학자도 있고, 무덤방 없이 기념물로 세운 고인돌도 있습니다. '기'는 고인돌을 세는 말입니다.
    facts: [f2, f4, f5, f6]
  - layout: term
    term: 추론
    example: 큰 덮개돌(본 것)+혼자 못 든다(아는 것) → 많은 사람이 힘을 모아 옮겼다(짐작)
    notes: 오늘 한 일에 이름을 붙여 줍니다. 본 것에 아는 것을 이어 짐작을 끌어내는 것이 추론입니다.
    facts: [f15]
  - layout: activity
    title: 이름 모를 물건에게 물어봅시다
    instructions:
      - 홀수 모둠은 그릇, 짝수 모둠은 돌 도구를 봅니다.
      - 살펴볼 곳마다 본 것을 먼저 적습니다.
      - 본 것과 짐작을 잇는 말을 '~하니까'로 적습니다.
      - 짝과 바꾸어 읽고 이어지는지 확인합니다.
    minutes: 6
    notes: 두 물건의 이름은 알려 주지 않습니다. 이름이 나오면 "맞아요, 그 이름은 다음 시간에 배워요. 지금은 무엇을 보고 알았나요?"로 받습니다.
  - layout: picture
    title: 이 그릇을 살펴봅시다
    media: pottery-amsa
    caption: 바닥, 겉면, 아래쪽 구멍을 봅시다
    notes: 바닥의 모양, 겉면의 무늬, 아래쪽 구멍을 차례로 가리킵니다. 이 사진에는 구멍이 두 개 보이지만 박물관이 올린 다른 쪽 사진에는 더 보입니다. 아이가 센 대로 말하게 합니다. 다음 시간들에서 다시 만나는 물건입니다.
    facts: [f8]
  - layout: picture
    title: 이 돌 도구를 살펴봅시다
    media: hand-axe
    caption: 길이 17.8cm
    notes: 전체 모양, 가장자리, 끝을 차례로 가리킵니다. 자로 17.8cm를 재어 보여 주면 크기를 짐작하기 쉽습니다. 이름이 나오면 "그 이름은 다음 시간에 배워요. 지금은 무엇을 보고 알았나요?"로 받습니다.
    facts: [f12]
  - layout: compare
    title: 박물관의 짐작과 견주어 봅시다
    left:
      label: 그릇
      points:
        - 아래쪽에 작은 구멍이 있다.
        - 깨진 곳을 고쳐 쓴 흔적으로 본다.
      media: pottery-amsa
    right:
      label: 돌 도구
      points:
        - 끝이 뾰족하고 가장자리에 날이 있다.
        - 여러 일에 쓰였다고 설명한다.
        - 주로 큰 동물을 가르는 데 썼다고 본다.
      media: hand-axe
    notes: 아이들의 짐작과 같아도, 달라도 괜찮습니다. 박물관도 '추정된다'고 적었다는 점을 짚습니다.
    facts: [f9, f10, f11]
  - layout: term
    term: 유적
    example: 고인돌은 옛사람이 만든 무덤 자리이니 유적입니다.
    notes: 오늘 본 고인돌에 낱말을 붙여 줍니다. 고인돌도 길을 내며 중장비로 옮긴 일이 많으니 '옮길 수 있나'보다 '옛사람이 살거나 일한 자리의 자취인가'로 가리게 합니다.
    facts: [f2, f13, f18]
  - layout: term
    term: 유물
    example: 오늘 본 그릇과 돌 도구는 옛사람이 남긴 물건이니 유물입니다.
    notes: 오늘 본 두 물건에 낱말을 붙여 줍니다. 오늘 본 세 가지는 서로 아주 다른 때에 남긴 것이라고 한마디 덧붙입니다.
    facts: [f14]
  - layout: quiz
    item: 1
    notes: 손을 들어 답하게 합니다. 틀린 답이 나오면 "그건 사진에서 가리킬 수 있나요?"를 먼저 묻습니다.
  - layout: points
    title: 이 단원에서 함께 물어볼 것
    points:
      - 옛사람은 무엇을 먹고 어디에서 살았을까요?
      - 쓰던 도구는 어떻게 바뀌었을까요?
      - 사람들은 어떻게 모여 나라를 세웠을까요?
      - 무엇을 보고 그렇게 짐작할 수 있을까요?
    notes: 이 단원은 유적과 유물을 보고 옛사람의 생활을 짐작해 가는 단원이라고 소개합니다. 질문만 보여 주고 답은 말하지 않습니다.
  - layout: closing
    title: 처음 생각이 달라졌나요?
    points:
      - 눈으로 본 것과 짐작한 것을 가릅니다.
      - 짐작에는 본 것을 까닭으로 붙입니다.
    notes: 칠판의 붙임쪽지 가운데 하나를 골라 지금이라면 어떻게 고쳐 쓰고 싶은지 듣고 마칩니다.

worksheet:
  title: 옛사람이 남긴 것에게 묻기
  subtitle: 본 것 · 짐작한 것 · 이어 주는 말
  print:
    per: student
    sides: duplex
  pages:
    - heading: 돌에게 묻기
      blocks:
        - type: prompt
          text: 고인돌 사진을 보고 한 말입니다. 눈으로 본 것인지, 짐작한 것인지 ○표 해 봅시다.
        - type: table
          columns: [말, 눈으로 본 것, 짐작한 것]
          rows:
            - [덮개돌이 받침돌 위에 얹혀 있다., "", ""]
            - [많은 사람이 힘을 모아 돌을 옮겼다., "", ""]
            - [덮개돌이 받침돌보다 훨씬 길다., "", ""]
            - [중요한 사람을 위해 만들었다., "", ""]
        - type: prompt
          text: 우리 모둠이 정한 차례 카드의 차례와 그 까닭을 적어 봅시다. 카드에 없는 방법이 떠오르면 그것도 적어 봅시다.
        - type: lines
          label: 차례와 까닭
          count: 4
    - heading: 물건에게 묻기
      blocks:
        - type: columns
          columns:
            - - type: figure
                media: pottery-amsa
                width: full
            - - type: figure
                media: hand-axe
                width: full
        - type: prompt
          text: 홀수 모둠은 그릇을, 짝수 모둠은 돌 도구를 살펴보고 표를 채워 봅시다.
        - type: prompt
          text: 그릇
        - type: table
          columns: [살펴볼 곳, 눈으로 본 것, 짐작한 것, "어떻게 이어지나요? (~하니까)"]
          rows:
            - [바닥 모양, "", "", ""]
            - [아래쪽 구멍, "", "", ""]
        - type: prompt
          text: 돌 도구
        - type: table
          columns: [살펴볼 곳, 눈으로 본 것, 짐작한 것, "어떻게 이어지나요? (~하니까)"]
          rows:
            - [전체 모양, "", "", ""]
            - [가장자리와 끝, "", "", ""]
  guide:
    - where: 1쪽 첫 표
      text: 첫째와 셋째 문장은 사진에서 가리킬 수 있으니 본 것이고, 둘째와 넷째는 짐작입니다.
    - where: 1쪽 차례와 까닭
      text: 정해진 답이 없습니다. 차례마다 까닭이 붙어 있는지 봅니다. 카드에 없는 방법도 까닭이 있으면 받아 줍니다.
    - where: 2쪽 표
      text: 정해진 답이 없습니다. '어떻게 이어지나요?' 칸에 본 것과 짐작을 잇는 아는 것(예. 큰 돌은 혼자 들 수 없다)이 들어가면 추론이 선 것입니다.
    - where: 2쪽 그릇의 구멍
      text: 박물관은 깨진 그릇을 임시로 고쳐 쓴 흔적으로 짐작합니다. 아이의 짐작이 달라도 까닭이 있으면 받아 줍니다.
    - where: 2쪽 돌 도구
      text: 박물관은 여러 가지 일에 쓰였고 주로 큰 동물을 잡아 가르는 데 썼다고 짐작합니다.
  facts: [f1, f3, f9, f11, f15]

quiz:
  items:
    - type: choice
      q: 그릇 사진을 보고 '눈으로 본 것'을 말한 것은 무엇인가요?
      choices:
        - 아래쪽에 작은 구멍이 있다.
        - 깨진 곳을 고쳐 썼을 것이다.
        - 물을 담아 두었을 것이다.
      answer: 1
      explain: 구멍은 사진에서 가리킬 수 있습니다. 나머지 둘은 본 것을 바탕으로 짐작한 말입니다.
      facts: [f9]
    - type: ox
      q: 추론은 까닭 없이 마음대로 상상하는 것이다.
      answer: false
      explain: 추론은 아는 것을 근거로 삼아 모르는 것을 짐작하는 일입니다. 그래서 까닭을 함께 말합니다.
      facts: [f15]
    - type: choice
      q: 고인돌이나 집터처럼 옛사람이 살거나 일한 자리에 남은 자취를 무엇이라고 하나요?
      choices:
        - 유물
        - 유적
        - 덮개돌
      answer: 2
      explain: 무덤이나 집터처럼 옛사람이 살거나 일한 자리에 남은 자취는 유적입니다.
      facts: [f13]
    - type: short
      q: 옛사람이 남긴 물건 가운데 그릇이나 도구 같은 것을 무엇이라고 하나요?
      answer: 유물
      explain: 그릇·도구 같은 물건은 유물, 무덤·집터처럼 자리에 남은 자취는 유적입니다.
      facts: [f13, f14]
    - type: ox
      q: 박물관은 그릇 아래쪽의 구멍을 깨진 그릇을 고쳐 쓴 흔적으로 짐작한다.
      answer: true
      explain: 박물관은 이 구멍들을 깨진 그릇을 임시로 고쳐 쓴 흔적으로 짐작합니다.
      facts: [f9]

assets:
  papercraft:
    state: ready
    title: 종이 고인돌 세우기
    module: dolmen-table
    pages: 3
    print:
      per: group
      paper: A4 180g 이상 두꺼운 종이
      materials: [가위, 풀]
      note: 실제 크기(100%)로 인쇄합니다. '페이지에 맞추기'를 켜면 조각 크기가 서로 맞지 않습니다. 도안의 굄돌은 받침돌과 같은 말입니다.
    steps:
      - 실선을 따라 조각과 차례 카드를 오립니다.
      - 점선을 따라 접고 풀칠 자리를 붙여 덮개돌, 굄돌, 막음돌, 통나무, 흙 경사로를 만듭니다.
      - 받침판의 자리에 굄돌 두 개와 막음돌을 세웁니다.
      - 덮개돌을 그 위에 얹습니다.
    # 도안의 차례 카드 네 장에 찍는 문장 (수업 화면 9번 장과 같은 차례)
    texts:
      - 받침돌을 세웁니다.
      - 받침돌 높이까지 흙이나 잡석을 쌓아 비탈을 만듭니다.
      - 통나무를 깔고 덮개돌을 비탈 위로 끌어 올립니다.
      - 쌓았던 흙을 걷어 내면 고인돌이 드러납니다.
    try_it:
      - 차례 카드 네 장을 섞은 뒤 모둠이 생각한 차례로 놓아 봅시다.
      - 흙 경사로와 통나무로 덮개돌을 올려 봅시다.
      - 그 차례로 놓은 까닭을 한 문장으로 말해 봅시다.
    reflect:
      - 이 차례를 실제로 본 사람이 있을까요? 그런데도 무엇을 보고 짐작할 수 있을까요?
    facts: [f1, f7, f17]
  coloring:
    state: planned
    idea: 우리가 그린 고인돌 그림(dolmen-parts)을 바탕으로 선 그림을 그리고, 찾아볼 것에 덮개돌과 받침돌을 넣는다. 부근리 사진은 CC BY-SA 라 본떠 그리지 않는다.
  making_kit:
    state: skip
    reason: 도입 차시라 본 것과 짐작을 가르는 쓰기가 중심이고, 만들기는 페이퍼크래프트로 이미 합니다.
  escape:
    state: planned
    idea: "한 방: 문장을 본 것과 짐작으로 가르고, 유적과 유물을 나누어야 문이 열린다."
  virtual3d:
    state: skip
    reason: 고인돌의 생김새는 페이퍼크래프트로 손에 쥐어 볼 수 있습니다. 이 단원의 3D 는 다른 차시에 둡니다.
  web_activity:
    state: ready
    title: 유적일까, 유물일까
    instructions: 카드를 끌어 알맞은 상자에 넣고, 까닭을 읽어 봅시다.
    activity:
      kind: sort
      bins:
        - id: site
          label: 유적
        - id: object
          label: 유물
      items:
        - text: 고인돌
          media: dolmen-bugeun
          bin: site
          why: 옛사람이 만든 무덤 자리입니다.
        - text: 흙으로 만든 그릇
          media: pottery-amsa
          bin: object
          why: 옛사람이 쓰던 물건입니다.
        - text: 돌로 만든 도구
          media: hand-axe
          bin: object
          why: 옛사람이 손에 쥐고 쓰던 물건입니다.
        - text: 옛사람이 살던 집터
          bin: site
          why: 땅에 남은 집의 자리입니다.
        - text: 옛사람의 무덤
          bin: site
          why: 옛사람이 만든 무덤 자리입니다.
        - text: 옛사람이 쓰던 그릇 조각
          bin: object
          why: 옛사람이 쓰던 물건의 조각입니다.
      facts: [f2, f8, f13, f14]
  cards:
    state: ready
    title: 낱말 카드
    cards:
      - front: 고인돌
        media: dolmen-bugeun
        facts: [f1, f2]
      - front: 덮개돌
        facts: [f3]
      - front: 받침돌
        facts: [f1]
      - front: 추론
        facts: [f15]
      - front: 유적
        facts: [f13]
      - front: 유물
        facts: [f14]
    games:
      - name: 뜻 듣고 낱말 맞히기
        how: 한 사람이 뒷면의 풀이를 읽으면 나머지가 앞면의 낱말을 맞힙니다.
      - name: 유적과 유물 가르기
        how: 유적과 유물 카드를 바닥에 놓고, 떠오르는 옛사람의 자취를 하나씩 말하며 어느 쪽인지 까닭과 함께 고릅니다.

misconceptions:
  - belief: 짐작은 정답이 없으니 아무렇게나 말해도 된다.
    response: 짐작에도 까닭이 있어야 한다고 말해 줍니다. "그건 무엇을 보고 그렇게 생각했나요?"를 묻고, 본 것을 대면 받아 줍니다.
  - belief: 박물관 설명은 그때 사람이 직접 보고 남긴 기록이다.
    response: 박물관도 남은 것을 보고 짐작했다고 말해 줍니다. 소장품 설명의 '추정된다'라는 말을 보여 주면 됩니다.
  - belief: 큰 돌이 놓여 있으면 모두 고인돌이다.
    response: 덮개돌 아래에 받침돌이나 땅속 무덤방 같은 짜임이 있는지 살펴 가린다고 말해 줍니다. 받침돌 없이 덮개돌만 땅 위에 놓인 고인돌도 있습니다. 생김새가 여러 가지라는 것은 4~5차시에서 다시 다룹니다.
  - belief: 유적은 커서 옮길 수 없는 것이고, 유물은 옮길 수 있는 것이다.
    response: 고인돌도 길을 내며 중장비로 옮긴 일이 많고, 비석처럼 큰 유물도 있다고 말해 줍니다. 옛사람이 살거나 일한 자리의 자취인지, 옛사람이 남긴 물건인지로 가립니다.

assessment:
  look_for: "① 본 것 칸에 사진에서 가리킬 수 있는 것만 적었는가 ② 짐작 칸이 본 것과 이어지는가 ③ 잇는 칸에 본 것과 짐작을 잇는 아는 것(~하니까)이 있는가. 셋 다면 잘함, ①②면 보통, ①만이면 다음 시간 시작에 \"그건 무엇을 보고?\"를 다시 묻습니다."
  where: 학습지 2쪽의 표

teacher_notes:
  - title: 오늘 쓰는 사진과 유물 (교사만)
    body:
      - 첫 사진은 강화 부근리 고인돌입니다 (위키미디어 공용, CC BY-SA 4.0). 페이퍼크래프트 도안도 같은 생김새입니다.
      - 그릇은 서울 암사동에서 나온 빗살무늬토기, 돌 도구는 경기도 파주에서 나온 주먹도끼입니다. 둘 다 국립중앙박물관 소장품입니다.
      - 세 가지는 서로 아주 다른 때의 것입니다. 아이가 고인돌을 만든 사람이 이 도구를 썼냐고 물으면 "서로 다른 때의 것이고, 언제인지는 다음 시간부터 알아봅니다"라고 답합니다.
      - 시대 이름과 유물 이름은 2차시부터 배웁니다. 오늘은 아이에게 이름을 말하지 않습니다.
  - title: 고인돌의 생김새와 이름
    body:
      - 표준국어대사전은 덮개돌을 '고인돌에서 굄돌이나 받침돌 위에 올려진 큰 돌'로 풀이합니다. 한국민족문화대백과사전은 받침돌을 고임돌이나 굄돌이라고도 한다고 적습니다. 아이들이 굄돌이라고 말해도 받아 줍니다. 페이퍼크래프트 도안에도 굄돌로 찍힙니다.
      - 받침돌 없이 덮개돌만 땅 위에 놓인 고인돌도 있습니다. 탁자식, 바둑판식처럼 생김새를 나누는 말은 4~5차시에서 다룹니다.
      - 한국민족문화대백과사전은 한반도 전체의 고인돌을 약 4만여 기로 추산합니다. 수업 화면의 '3만 기가 넘습니다'는 확인된 수를 적은 박물관 자료를 따른 것입니다.
  - title: 덮개돌을 올린 차례
    body:
      - 한국민족문화대백과사전은 덮개돌을 올린 방법을 세 가지로 짐작합니다. 통나무를 레일처럼 비스듬히 깔아 끌어올리기, 흙이나 잡석을 쌓아 끌어올리기(받침돌이 낮은 고인돌), 통나무를 井자로 쌓아 들어 올리기(받침돌이 높은 탁자식)입니다.
      - 수업 화면 9번 장과 차례 카드는 둘째 방법을 단순하게 그린 것입니다. 사진의 고인돌처럼 받침돌이 높은 고인돌에는 셋째 방법을 짐작하기도 합니다. 아이가 물으면 그대로 알려 주어도 좋은 추론 거리입니다.
      - 넷째 장의 '흙을 걷어 낸다'는 지금 고인돌 둘레에 흙 언덕이 없다는 것을 보고 덧붙인 짐작입니다. 백과사전은 덮개돌과 받침돌 사이에 눌린 흙을 흙을 쌓았던 흔적으로 듭니다 (사실 f19).
      - 백과사전은 인도네시아 숨바 섬에서 고인돌을 세운 사례 등으로 옮기는 방법을 복원합니다. 다른 차례를 내놓은 모둠도 까닭이 있으면 받아 줍니다.
  - title: 무덤에 관한 물음
    body:
      - "\"지금도 사람이 묻혀 있나요?\"라고 물으면 \"무덤방에서 사람뼈가 나온 고인돌도 있습니다. 옛사람의 무덤이니 함부로 올라가지 않습니다\"라고 답합니다."
  - title: 미리 할 일
    body:
      - 페이퍼크래프트는 모둠마다 3쪽입니다. 수업 전에 조각을 오리고 접어 붙여 두는 데 시간이 꽤 걸릴 수 있습니다. 앞 시간에 아이들과 함께 만들어 둘 수도 있습니다.
  - title: 시간이 모자랄 때
    body:
      - 7번 장에서 페이퍼크래프트를 세우는 대신 수업 화면 9번 장의 그림 네 장을 섞어 보여 주고 차례만 짐작하게 할 수 있습니다.
      - 웹 활동 '유적일까, 유물일까'는 다음 시간 시작이나 과제로 쓸 수 있습니다.
