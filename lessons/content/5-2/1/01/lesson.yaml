        url: https://www.museum.go.kr/MUSEUM/contents/M0201030300.do?showHallId=760&showroomCode=DM0004
        quote: 우두머리의 역할은 점점 더 중요해져 권위와 권력을 갖게 되었다. 사람들은 그들을 기억하기 위해 고인돌과 같은 큰 기념물을 만들었다.
        accessed: "2026-11-19"
  - id: f7
    claim: 덮개돌을 올린 방법으로 짐작하는 것 가운데 하나는 받침돌이 낮은 고인돌에서 흙이나 잡석을 쌓고 덮개돌을 끌어 올리는 방법이다.
