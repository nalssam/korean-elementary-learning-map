flow:
  - phase: 도입
    minutes: 6
    title: 큰 돌 사진을 보고 첫 생각 붙이기
    do:
      - 고인돌 사진을 띄우고 30초 동안 말없이 보게 합니다.
      - 보이는 것을 세 명에게 묻고 칠판 한쪽에 그대로 적습니다.
      - "'누가, 왜, 어떻게 놓았을까?'에 대한 생각을 붙임쪽지에 한 줄씩 적게 합니다."
      - 붙임쪽지는 칠판 다른 쪽에 붙이고 수업 끝까지 둡니다.
    ask:
      - q: 사진에서 무엇이 보이나요?
        listen_for: 돌의 모양, 크기, 놓인 자리처럼 사진에 있는 것을 말하는지 듣습니다. 짐작이 섞여 나와도 이때는 고치지 않습니다.
    uses: [slides]
    slides: [1, 3]
    facts: [f1]
  - phase: 전개
    minutes: 6
    title: 본 것과 짐작한 것 가르기
    do:
      - 고인돌 그림에서 덮개돌과 받침돌의 이름을 알려 줍니다.
      - 학습지 1쪽의 네 문장을 '본 것'과 '짐작한 것'으로 가르게 합니다.
      - 칠판에 적어 둔 아이들의 말도 같은 기준으로 둘로 나눕니다.
    ask:
      - q: 그건 사진에 보이나요, 머릿속으로 생각한 것인가요?
        listen_for: 사진을 손가락으로 가리킬 수 있으면 본 것이고, 가리킬 수 없으면 짐작이라는 기준을 아이들이 스스로 쓰는지 봅니다.
    uses: [slides, worksheet]
    slides: [4, 6]
    facts: [f1, f3]
  - phase: 전개
    minutes: 12
    title: 종이 고인돌을 세우며 차례 짐작하기
    do:
      - 모둠마다 미리 오려 둔 고인돌 조각과 차례 카드를 나누어 줍니다.
      - 받침돌을 세우고 덮개돌을 얹게 합니다.
      - 차례 카드 네 장을 모둠이 정한 차례로 놓고 까닭을 학습지에 적게 합니다.
      - 두 모둠에게 차례와 까닭을 발표하게 합니다.
      - 한 가지 짐작을 그림으로 보여 주고 모둠의 차례와 견주게 합니다.
      - 박물관 설명으로 '누가, 왜'의 짐작을 하나 보여 줍니다.
    ask:
      - q: 무거운 덮개돌을 받침돌 위로 올리려면 무엇이 있어야 했을까요?
        listen_for: 흙, 통나무, 많은 사람 같은 말이 나오면 "왜 그렇게 생각했나요?"를 한 번 더 묻습니다.
      - q: 이 차례를 실제로 본 사람이 있을까요?
        listen_for: 아무도 보지 못했으니 짐작이라는 말이 나오는지 듣습니다.
    uses: [papercraft, worksheet, slides]
    slides: [7, 11]
    tip: 조각 오리기는 수업 전에 해 두면 이 단계를 세우기와 차례 짐작에 쓸 수 있습니다. 모둠 안에서 받침돌, 덮개돌, 차례 카드, 기록을 한 사람씩 맡게 합니다.
    facts: [f2, f4, f6, f7, f15]
  - phase: 전개
    minutes: 11
    title: 이름 모를 물건 두 점에게 묻기
    do:
      - 그릇 사진과 돌 도구 사진을 차례로 띄웁니다.
      - 학습지 2쪽 표의 살펴볼 곳마다 본 것, 짐작한 것, 까닭을 적게 합니다.
      - 짝과 바꾸어 읽고 까닭 칸에 본 것이 들어 있는지 서로 확인하게 합니다.
      - 박물관의 짐작을 보여 주고 자기 짐작과 견주게 합니다.
    ask:
      - q: 그릇 아래쪽의 구멍 두 개는 왜 뚫었을까요?
        listen_for: 매달려고, 물을 빼려고, 고치려고 같은 여러 짐작이 나올 수 있습니다. 어느 것이든 까닭을 붙였는지만 봅니다.
    uses: [worksheet, slides]
    slides: [12, 15]
    facts: [f8, f9, f10, f11, f12]
  - phase: 정리
    minutes: 5
    title: 유적과 유물, 그리고 이 단원에서 물을 것
    do:
      - 유적과 유물의 뜻을 오늘 본 것에 하나씩 붙여 봅니다.
      - 확인 퀴즈 한 문항을 함께 풉니다.
      - 단원에서 함께 물어볼 질문을 보여 줍니다.
      - 칠판의 붙임쪽지 가운데 하나를 골라 지금 생각과 견주게 합니다.
    uses: [slides, quiz]
    slides: [16, 20]
    facts: [f13, f14]

slides:
  - layout: title
    title: 고인돌, 누가 어떻게?
    subtitle: 옛사람이 남긴 것에게 물어봅시다
    notes: 오늘은 답을 알려 주는 시간이 아니라 묻는 방법을 익히는 시간이라고 먼저 말합니다.
  - layout: picture
    title: 무엇이 보이나요?
    media: dolmen-yangwon
    notes: 30초 동안 말없이 보게 합니다. 이 돌의 이름은 아직 말하지 않습니다.
    facts: [f1]
  - layout: question
    kicker: 첫 생각
    title: 이 큰 돌은 누가, 왜, 어떻게 놓았을까요?
    hint: 떠오른 생각을 붙임쪽지에 한 줄로 적어 봅시다.
    media: dolmen-yangwon
    notes: 붙임쪽지는 칠판에 붙여 두고 정리 때 다시 봅니다. 맞고 틀림을 말하지 않습니다.
  - layout: picture
    title: 이 돌의 이름은 고인돌입니다
    media: dolmen-parts
    caption: 위의 큰 돌은 덮개돌, 아래 돌은 받침돌
    notes: 덮개돌과 받침돌을 손으로 가리키며 읽게 합니다. 무덤이라는 것은 뒤에서 박물관 설명으로 보여 줍니다.
    facts: [f1, f3]
  - layout: points
    title: 본 것일까요, 짐작일까요?
    points:
      - 덮개돌이 받침돌 위에 얹혀 있다.
      - 많은 사람이 힘을 모아 돌을 옮겼다.
      - 덮개돌이 받침돌보다 훨씬 길다.
      - 중요한 사람을 위해 만들었다.
    notes: 한 문장씩 읽고 본 것이면 손바닥, 짐작이면 주먹을 들게 합니다. 학습지 1쪽 첫 표와 같은 문장입니다.
    facts: [f1]
  - layout: compare
    title: 사진에서 가리킬 수 있나요?
    left:
      label: 눈으로 본 것
      points:
        - 덮개돌이 받침돌 위에 있다.
        - 덮개돌이 받침돌보다 길다.
    right:
      label: 짐작한 것
      points:
        - 많은 사람이 함께 옮겼다.
        - 중요한 사람을 위해 만들었다.
    notes: 사진에서 손가락으로 가리킬 수 있으면 본 것, 가리킬 수 없으면 짐작이라는 기준을 정리합니다. 짐작이 나쁜 것이 아니라 까닭이 있어야 한다는 말을 덧붙입니다.
    facts: [f1]
  - layout: activity
    title: 종이 고인돌을 세워 봅시다
    instructions:
      - 받침돌 두 개를 받침판에 세웁니다.
      - 덮개돌을 받침돌 위에 얹습니다.
      - 차례 카드 네 장을 모둠이 정한 차례로 놓습니다.
      - 그 차례로 정한 까닭을 학습지에 적습니다.
    minutes: 7
    notes: 덮개돌을 손으로 얹는 것과 진짜 큰 돌을 얹는 것이 어떻게 다를지 묻습니다. 차례 카드는 정답을 맞히는 놀이가 아니라 까닭을 말하는 연습입니다.
  - layout: question
    kicker: 모둠 발표
    title: 무거운 덮개돌을 어떻게 올렸을까요?
    hint: 모둠이 정한 차례와 그 까닭을 말해 봅시다.
    notes: 두 모둠만 발표합니다. 다른 모둠은 발표를 듣고 "그 까닭이 사진이나 모형에서 보이나요?"를 묻게 합니다.
  - layout: steps
    title: 이렇게 올렸다는 짐작이 있습니다
    steps:
      - label: 하나
        text: 땅을 파고 받침돌을 세웁니다.
        media: dolmen-step1
      - label: 둘
        text: 받침돌이 묻히도록 흙을 쌓아 언덕을 만듭니다.
        media: dolmen-step2
      - label: 셋
        text: 통나무를 깔고 덮개돌을 끌어 올립니다.
        media: dolmen-step3
      - label: 넷
        text: 흙을 걷어 내면 고인돌이 드러납니다.
        media: dolmen-step4
    notes: 제목의 '짐작'을 꼭 읽어 줍니다. 이 차례를 본 사람이 남긴 기록은 없습니다. 모둠의 차례와 다른 점을 하나씩 찾게 합니다.
    facts: [f7]
  - layout: points
    title: 박물관은 이렇게 짐작합니다
    points:
      - 고인돌은 옛사람의 무덤입니다.
      - 마을 우두머리를 기억하려고 만들었다고 봅니다.
      - 우리나라에서 찾은 고인돌만 약 3만 기가 넘습니다.
    media: dolmen-parts
    notes: 첫 생각의 '누가, 왜'와 견주게 합니다. 박물관 설명도 남은 것을 보고 짐작한 것이라는 점을 짚습니다. '기'는 고인돌을 세는 말입니다.
    facts: [f2, f4, f6]
  - layout: term
    term: 추론
    example: 덮개돌이 아주 크다(본 것) → 여러 사람이 함께 옮겼을 것이다(짐작)
    notes: 오늘 한 일에 이름을 붙여 줍니다. 본 것 → 짐작 → 까닭의 세 칸이 추론입니다.
    facts: [f15]
  - layout: activity
    title: 이름 모를 물건에게 물어봅시다
    instructions:
      - 학습지 2쪽의 사진 두 장을 봅니다.
      - 살펴볼 곳마다 본 것을 먼저 적습니다.
      - 본 것을 까닭으로 들어 짐작을 적습니다.
      - 짝과 바꾸어 까닭 칸을 확인합니다.
    minutes: 7
    notes: 두 물건의 이름은 알려 주지 않습니다. 이름을 아는 아이에게는 이름 대신 까닭을 말해 달라고 합니다.
  - layout: picture
    title: 이 그릇을 살펴봅시다
    media: pottery-amsa
    caption: 바닥, 겉면, 아래쪽 구멍을 봅시다
    notes: 바닥의 모양, 겉면의 무늬, 아래쪽 구멍을 차례로 가리킵니다. 다음 시간들에서 다시 만나는 물건입니다.
    facts: [f8]
  - layout: picture
    title: 이 돌 도구를 살펴봅시다
    media: hand-axe
    caption: 길이 17.8cm
    notes: 전체 모양, 가장자리, 끝을 차례로 가리킵니다. 자로 17.8cm를 재어 보여 주면 크기를 짐작하기 쉽습니다.
    facts: [f12]
  - layout: compare
    title: 박물관의 짐작과 견주어 봅시다
    left:
      label: 그릇
      points:
        - 아래쪽에 구멍이 두 개 있다.
        - 깨진 곳을 고쳐 쓴 흔적으로 본다.
      media: pottery-amsa
    right:
      label: 돌 도구
      points:
        - 날이 날카롭고 끝이 뾰족하다.
        - 여러 일에 쓰였다고 본다.
        - 주로 큰 동물을 가르는 데 썼다고 본다.
      media: hand-axe
    notes: 아이들의 짐작과 같아도, 달라도 괜찮습니다. 박물관도 '추정된다'고 적었다는 점을 짚습니다.
    facts: [f9, f10, f11]
  - layout: term
    term: 유적
    example: 고인돌은 땅에 자리 잡고 있어 옮길 수 없으니 유적입니다.
    notes: 오늘 본 고인돌에 낱말을 붙여 줍니다.
    facts: [f1, f13]
  - layout: term
    term: 유물
    example: 오늘 본 그릇과 돌 도구는 들어 옮길 수 있으니 유물입니다.
    notes: 오늘 본 두 물건에 낱말을 붙여 줍니다.
    facts: [f14]
  - layout: quiz
    item: 1
    notes: 손을 들어 답하게 합니다. 틀린 답이 나오면 "그건 사진에서 가리킬 수 있나요?"를 먼저 묻습니다.
  - layout: points
    title: 이 단원에서 함께 물어볼 것
    points:
      - 옛사람은 무엇을 먹고 어디에서 살았을까요?
      - 쓰던 도구는 어떻게 바뀌었을까요?
      - 사람들은 어떻게 모여 나라를 세웠을까요?
      - 무엇을 보고 그렇게 짐작할 수 있을까요?
    notes: 이 단원은 유적과 유물을 보고 옛사람의 생활을 짐작해 가는 단원이라고 소개합니다. 질문만 보여 주고 답은 말하지 않습니다.
  - layout: closing
    title: 처음 생각이 달라졌나요?
    points:
      - 눈으로 본 것과 짐작한 것을 가릅니다.
      - 짐작에는 본 것을 까닭으로 붙입니다.
    notes: 칠판의 붙임쪽지 가운데 하나를 골라 지금이라면 어떻게 고쳐 쓰고 싶은지 듣고 마칩니다.

worksheet:
  title: 옛사람이 남긴 것에게 묻기
  subtitle: 본 것 · 짐작한 것 · 까닭
  print:
    per: student
    sides: duplex
  pages:
    - heading: 돌에게 묻기
      blocks:
        - type: prompt
          text: 고인돌 사진을 보고 한 말입니다. 눈으로 본 것인지, 짐작한 것인지 ○표 해 봅시다.
        - type: table
          columns: [말, 눈으로 본 것, 짐작한 것]
          rows:
            - [덮개돌이 받침돌 위에 얹혀 있다., "", ""]
            - [많은 사람이 힘을 모아 돌을 옮겼다., "", ""]
            - [덮개돌이 받침돌보다 훨씬 길다., "", ""]
            - [중요한 사람을 위해 만들었다., "", ""]
        - type: prompt
          text: 고인돌의 곳곳을 살펴보고 표를 채워 봅시다.
        - type: table
          columns: [살펴볼 곳, 눈으로 본 것, 짐작한 것, 그렇게 짐작한 까닭]
          rows:
            - [덮개돌, "", "", ""]
            - [받침돌, "", "", ""]
            - [놓인 자리, "", "", ""]
        - type: prompt
          text: 우리 모둠이 정한 차례 카드의 차례와 그 까닭을 적어 봅시다.
        - type: lines
          label: 차례와 까닭
          count: 3
    - heading: 물건에게 묻기
      blocks:
        - type: columns
          columns:
            - - type: figure
                media: pottery-amsa
                width: full
            - - type: figure
                media: hand-axe
                width: full
        - type: prompt
          text: 그릇을 살펴보고 표를 채워 봅시다.
        - type: table
          columns: [살펴볼 곳, 눈으로 본 것, 짐작한 것, 그렇게 짐작한 까닭]
          rows:
            - [바닥 모양, "", "", ""]
            - [겉면의 무늬, "", "", ""]
            - [아래쪽 구멍 두 개, "", "", ""]
        - type: prompt
          text: 돌 도구를 살펴보고 표를 채워 봅시다.
        - type: table
          columns: [살펴볼 곳, 눈으로 본 것, 짐작한 것, 그렇게 짐작한 까닭]
          rows:
            - [전체 모양, "", "", ""]
            - [가장자리와 끝, "", "", ""]
            - [크기 (17.8cm), "", "", ""]
        - type: sentence_frame
          frame: 박물관은 ___라고 짐작했고, 나는 ___라고 짐작했다.
  guide:
    - where: 1쪽 첫 표
      text: 첫째와 셋째 문장은 사진에서 가리킬 수 있으니 본 것이고, 둘째와 넷째는 짐작입니다.
    - where: 1쪽 둘째 표와 2쪽 표
      text: 정해진 답이 없습니다. '그렇게 짐작한 까닭' 칸에 '눈으로 본 것' 칸의 내용이 들어 있으면 추론이 선 것입니다.
    - where: 2쪽 그릇의 구멍
      text: 박물관은 깨진 그릇을 임시로 고쳐 쓴 흔적으로 짐작합니다. 아이의 짐작이 달라도 까닭이 있으면 받아 줍니다.
    - where: 2쪽 돌 도구
      text: 박물관은 여러 가지 일에 쓰였고 주로 큰 동물을 잡아 가르는 데 썼다고 짐작합니다.
  facts: [f1, f3, f9, f11, f12, f15]

quiz:
  items:
    - type: choice
      q: 그릇 사진을 보고 '눈으로 본 것'을 말한 것은 무엇인가요?
      choices:
        - 아래쪽에 구멍이 두 개 있다.
        - 깨진 곳을 고쳐 썼을 것이다.
        - 물을 담아 두었을 것이다.
      answer: 1
      explain: 구멍은 사진에서 가리킬 수 있습니다. 나머지 둘은 본 것을 바탕으로 짐작한 말입니다.
      facts: [f9]
    - type: ox
      q: 추론은 까닭 없이 마음대로 상상하는 것이다.
      answer: false
      explain: 추론은 아는 것을 근거로 삼아 모르는 것을 짐작하는 일입니다. 그래서 까닭을 함께 말합니다.
      facts: [f15]
    - type: choice
      q: 고인돌처럼 땅에 자리 잡고 있어 옮길 수 없는 옛사람의 자취를 무엇이라고 하나요?
      choices:
        - 유적
        - 유물
        - 덮개돌
      answer: 1
      explain: 무덤이나 집터처럼 옮길 수 없는 것은 유적입니다.
      facts: [f13]
    - type: short
      q: 옛사람이 남긴 물건 가운데 그릇이나 도구처럼 옮길 수 있는 것을 무엇이라고 하나요?
      answer: 유물
      explain: 옮길 수 있는 것은 유물, 옮길 수 없는 것은 유적입니다.
      facts: [f13, f14]
    - type: ox
      q: 박물관은 그릇 아래쪽의 구멍 두 개를 깨진 그릇을 고쳐 쓴 흔적으로 짐작한다.
      answer: true
      explain: 박물관은 이 구멍을 깨진 그릇을 임시로 고쳐 쓴 흔적으로 짐작합니다.
      facts: [f9]

assets:
  papercraft:
    state: ready
    title: 종이 고인돌 세우기
    module: dolmen-table
    pages: 3
    print:
      per: group
      paper: A4 180g 이상 두꺼운 종이
      materials: [가위, 풀]
      note: 실제 크기(100%)로 인쇄합니다. '페이지에 맞추기'를 켜면 조각 크기가 서로 맞지 않습니다.
    steps:
      - 실선을 따라 조각과 차례 카드를 오립니다.
      - 점선을 따라 접습니다.
      - 받침돌 두 개를 받침판에 세워 붙입니다.
      - 덮개돌을 받침돌 위에 얹습니다.
    # 도안의 차례 카드 네 장에 찍는 문장 (수업 화면 9번 장과 같은 차례)
    texts:
      - 땅을 파고 받침돌을 세웁니다.
      - 받침돌이 묻히도록 흙을 쌓아 언덕을 만듭니다.
      - 통나무를 깔고 덮개돌을 끌어 올립니다.
      - 흙을 걷어 내면 고인돌이 드러납니다.
    try_it:
      - 차례 카드 네 장을 섞은 뒤 모둠이 생각한 차례로 놓아 봅시다.
      - 그 차례로 놓은 까닭을 한 문장으로 말해 봅시다.
    reflect:
      - 이 차례를 실제로 본 사람이 있을까요? 그런데도 어떻게 짐작할 수 있을까요?
    facts: [f1, f7]
  coloring:
