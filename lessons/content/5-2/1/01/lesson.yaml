# 5학년 2학기 1단원 1차시 (단원 도입) — 초안(draft).
# 차시 번호·쪽수·성취기준은 차시표(content/registry.yaml)에 있습니다.
# 이 차시는 지식보다 방법을 먼저 줍니다: 눈으로 본 것과 짐작한 것을 가르고, 짐작에는 까닭을 붙입니다.
# 시대 이름은 2차시부터 배우므로 아이가 읽는 글에 쓰지 않습니다. 유물 이름도 아이에게는 알려 주지 않습니다.
#
# 편성표와 다른 점 (편성표를 고칠 때 참고)
#   - 영상은 쓰지 않습니다. 사진 관찰로 대신합니다 (본 것과 짐작을 가르려면 멈춰 있는 사진이 낫습니다).
#   - 카드에서 탁자식·바둑판식을 뺐습니다. 생김새를 나누는 말은 4~5차시에서 다룹니다.
#   - 방탈출은 '고인돌 추론 문서 읽기' 대신 문장 가르기와 유적·유물 나누기로 잡았습니다 (아직 planned).
#   - 사진과 페이퍼크래프트는 편성표대로 강화 부근리 고인돌(탁자식)에 맞췄습니다.
schema_version: 1
id: 5-2/1/01
title: 이 큰 돌, 누가 어떻게?
tagline: 단원의 첫 시간입니다. 고인돌과 이름을 감춘 유물 두 점을 보며, 본 것과 짐작한 것을 가르고 짐작에 까닭을 붙이는 방법을 먼저 익힙니다.
status: draft

objectives:
  - 사진이나 물건을 보고 눈으로 본 것과 짐작한 것을 가려 말한다.
  - 본 것을 까닭으로 들어 옛사람이 무엇을 했는지 짐작해 쓴다.
  - 유적과 유물을 예를 들어 구분한다.

prepare:
  - item: 붙임쪽지
    qty: 한 사람에 1장
  - item: 페이퍼크래프트 (수업 전에 오리고 접어 붙여 둔 조각과 차례 카드 4장)
    qty: 모둠마다 1벌
  - item: 30cm 자
    qty: 1개 (교사)

sensitivity:
  level: none

terms:
  new:
    - term: 고인돌
      meaning: 큰 돌을 받침돌 위에 얹어 만든 옛사람의 무덤
      facts: [f1, f2]
    - term: 덮개돌
      meaning: 고인돌에서 받침돌 위에 올려진 큰 돌
      facts: [f3]
    - term: 받침돌
      meaning: 고인돌에서 덮개돌을 아래에서 받치는 돌
      facts: [f1]
    - term: 추론
      meaning: 아는 것을 근거로 삼아 모르는 것을 짐작하는 일
      facts: [f15]
    - term: 유적
      meaning: 옛사람이 살거나 일한 자리에 남은 자취. 무덤이나 집터 같은 것
      facts: [f13]
    - term: 유물
      meaning: 옛사람이 남긴 물건. 그릇이나 도구 같은 것
      facts: [f14]

facts:
  - id: f1
    claim: 고인돌은 큰 바위 아래를 받침돌이 받치고 있는 것으로, 한자로는 지석묘라고 부른다.
    sources:
      - name: 국립광주박물관 (국립중앙박물관 누리집 보도자료, 2007)
        title: "[광주]‘사진으로 본 고인돌의 세계’ 특별전시 개최"
        url: https://www.museum.go.kr/MUSEUM/contents/M0701040000.do?schM=view&catCustomType=post&catId=93&arcId=2872
        quote: 고인돌은 큰 바위 아래에 받침돌이 있는 것으로 한자로는 ‘지석묘支石墓’라 한다.
        accessed: "2026-11-19"
      - name: 한국민족문화대백과사전 (한국학중앙연구원)
        title: 고인돌
        url: https://encykorea.aks.ac.kr/Article/E0003901
        quote: 받침돌은 덮개돌을 웅장하게 보이게 하거나 무덤방을 보호하는 역할을 한다. 고임돌이나 굄돌이라고도 한다.
        accessed: "2026-11-19"
  - id: f2
    claim: 고인돌은 옛사람의 무덤으로 알려져 왔고, 무덤방 없이 기념물로 세운 고인돌도 있다.
    sources:
      - name: 국립중앙박물관
        title: "[순회전시] 한국의 청동기문화 특별전"
        url: https://www.museum.go.kr/MUSEUM/contents/M0202010000.do?schM=view&menuId=specialGallery&listType=list&exhiSpThemId=3802
        quote: 고인돌은 한국의 요녕식동검문화에서만 볼 수 있는 특징적인 무덤이다.
        accessed: "2026-11-19"
      - name: 표준국어대사전 (국립국어원)
        title: 고인-돌
        url: https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=%EA%B3%A0%EC%9D%B8%EB%8F%8C
        quote: 큰 돌을 몇 개 둘러 세우고 그 위에 넓적한 돌을 덮어 놓은 선사 시대의 무덤.
        accessed: "2026-11-19"
      - name: 한국민족문화대백과사전 (한국학중앙연구원)
        title: 고인돌
        url: https://encykorea.aks.ac.kr/Article/E0003901
        quote: 고인돌의 기능에 대해서 19세기 말부터 고분설과 제단설이 제기되기도 하였으나 무덤 고인돌과 기념 고인돌로 크게 구분할 수 있다.
        accessed: "2026-11-19"
  - id: f3
    claim: 고인돌에서 받침돌 위에 올려진 큰 돌을 덮개돌이라고 부른다.
    sources:
      - name: 표준국어대사전 (국립국어원)
        title: 덮개-돌
        url: https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=%EB%8D%AE%EA%B0%9C%EB%8F%8C
        quote: 고인돌에서 굄돌이나 받침돌 위에 올려진 큰 돌.
        accessed: "2026-11-19"
  - id: f4
    claim: 우리나라에서 확인된 고인돌은 3만 기가 넘고, 최근 백과사전은 한반도 전체에 약 4만여 기가 있다고 추산한다.
    sources:
      - name: 국립광주박물관 (국립중앙박물관 누리집 보도자료, 2007)
        title: "[광주]‘사진으로 본 고인돌의 세계’ 특별전시 개최"
