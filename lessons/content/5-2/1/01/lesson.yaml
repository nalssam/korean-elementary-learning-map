misconceptions:
  - belief: 짐작은 정답이 없으니 아무렇게나 말해도 된다.
    response: 짐작에도 까닭이 있어야 한다고 말해 줍니다. “그건 무엇을 보고 그렇게 생각했나요?”를 묻고, 본 것을 대면 받아 줍니다.
  - belief: 박물관 설명은 그때 사람이 직접 보고 남긴 기록이다.
    response: 박물관도 남은 것을 보고 짐작했다고 말해 줍니다. 소장품 설명의 ‘추정된다’라는 말을 보여 주면 됩니다.
  - belief: 큰 돌이 놓여 있으면 모두 고인돌이다.
    response: 덮개돌 아래에 받침돌이나 땅속 무덤방 같은 짜임이 있는지 살펴 가린다고 말해 줍니다. 받침돌 없이 덮개돌만 땅 위에 놓인 고인돌도 있습니다. 생김새가 여러 가지라는 것은 4~5차시에서 다시 다룹니다.
  - belief: 유적은 커서 옮길 수 없는 것이고, 유물은 옮길 수 있는 것이다.
    response: 논밭을 정리하고 길을 내는 과정에서 중장비로 옮겨지거나 부서진 고인돌도 많다고 말해 줍니다. 옮겼는지가 아니라, 옛사람이 살거나 일한 자리의 자취인지 옛사람이 남긴 물건인지로 가립니다.

assessment:
  look_for: "① 본 것 칸에 사진에서 가리킬 수 있는 것만 적었는가 ② 짐작 칸이 본 것과 이어지는가 ③ 아는 것 칸에 본 것과 짐작을 잇는 일반적인 앎(~하니까)이 있는가. ①②③이 모두 되면 잘함, ①과 ② 가운데 하나 이상이 되면 보통, ①과 ② 둘 다 되지 않으면 노력 요함으로 봅니다. 노력 요함인 아이에게는 다음 시간 시작에 “그건 무엇을 보고 알았나요?”를 다시 묻습니다. 유적과 유물을 가르는 것은 확인 퀴즈 3·4번으로 봅니다."
  where: 학습지 2쪽의 표

teacher_notes:
  - title: 오늘 쓰는 사진과 유물 (교사만)
    body:
      - 첫 사진은 강화 부근리 고인돌입니다 (위키미디어 공용, CC BY-SA 4.0). 페이퍼크래프트 도안도 같은 생김새입니다.
      - 그릇은 서울 암사동에서 나온 빗살무늬토기, 돌 도구는 경기도 파주에서 나온 주먹도끼입니다. 둘 다 국립중앙박물관 소장품입니다.
      - 세 가지는 서로 아주 다른 때의 것입니다. 아이가 고인돌을 만든 사람이 이 도구를 썼냐고 물으면 “서로 다른 때의 것이고, 언제인지는 다음 시간부터 알아봅니다”라고 답합니다.
      - 시대 이름과 유물 이름은 2차시부터 배웁니다. 오늘은 아이에게 이름을 말하지 않습니다.
  - title: 고인돌의 생김새와 이름
    body:
      - 아이들이 굄돌이라고 말하면 받침돌과 같은 말이라고 한 번 알려 줍니다.
      - 받침돌 없이 덮개돌만 땅 위에 놓인 고인돌도 있습니다. 탁자식, 바둑판식처럼 생김새를 나누는 말은 4~5차시에서 다룹니다.
      - 한국민족문화대백과사전은 한반도 전체의 고인돌을 약 4만여 기로 추산합니다. 수업 화면의 ‘3만 기가 넘습니다’는 확인된 수를 적은 박물관 자료를 따른 것입니다.
  - title: 덮개돌을 올린 차례
    body:
      - 한국민족문화대백과사전은 덮개돌을 올린 방법을 세 가지로 짐작합니다. 통나무를 레일처럼 비스듬히 깔아 끌어 올리기, 흙이나 돌을 쌓아 끌어 올리기, 통나무를 井자로 쌓아 들어 올리기입니다.
      - 고창 세계유산 고인돌박물관은 받침돌을 세운 뒤 흙을 경사지게 쌓고, 그 위로 덮개돌을 끌어 올린 다음 흙을 걷어 냈다고 짐작합니다. 수업 화면 10번 장과 차례 카드는 이 차례를 따릅니다. 두 사전(한국민족문화대백과사전, 한국고고학사전)은 흙을 쌓아 올리는 방법을 받침돌이 낮은 고인돌에, 통나무를 井자로 쌓는 방법을 부근리 같은 탁자식 고인돌에 짝지어 설명합니다. 어느 쪽이든 지켜본 사람이 없는 짐작이고, 화면의 차례는 여러 짐작 가운데 하나입니다.
      - 백과사전은 덮개돌과 받침돌 사이에 눌려 있는 흙을, 흙더미를 쌓았던 흔적으로 봅니다. 한국고고학사전은 끌어 올린 뒤 흙을 걷어 냈다고 짐작합니다. 차례 그림의 넷째 그림(흙을 걷어 낸다)이 이것입니다.
      - 백과사전은 인도네시아 숨바 섬에서 고인돌을 세운 사례 등으로 옮기는 방법을 복원합니다. 다른 차례를 내놓은 모둠도 까닭이 있으면 받아 줍니다.
  - title: 무덤에 관한 물음
    body:
      - “지금도 사람이 묻혀 있나요?”라고 물으면 “무덤방에서 사람뼈가 나온 고인돌도 있습니다. 옛사람의 무덤이니 함부로 올라가지 않습니다”라고 답합니다.
  - title: 미리 할 일
    body:
      - 페이퍼크래프트는 모둠마다 덮개돌, 받침돌 두 개, 흙 비탈, 통나무 세 개를 만들어 두어야 해서 수업 전 준비에 시간이 오래 걸릴 수 있습니다. 앞 시간에 모둠이 함께 만들어 둘 수도 있습니다. 조각은 바닥판에 붙이지 않습니다.
      - 차례를 짐작하는 활동에는 차례 카드 네 장만 있으면 됩니다. 시간이 없으면 차례 카드만 오려 씁니다.
      - 통나무 대신 연필 세 자루를 써도 됩니다.
  - title: 시간이 모자랄 때
    body:
      - 7번 장에서 종이 고인돌을 세우는 대신 수업 화면 10번 장의 그림 네 장을 섞어 보여 주고 차례만 짐작하게 할 수 있습니다.
      - 웹 활동 ‘유적일까, 유물일까’는 다음 시간 시작에 쓰거나 과제로 낼 수 있습니다.
