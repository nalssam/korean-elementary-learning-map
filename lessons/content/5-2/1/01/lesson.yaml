# 5학년 2학기 1단원 1차시 (단원 도입) — 초안(draft).
# 차시 번호·쪽수·성취기준은 차시표(content/registry.yaml)에 있습니다.
# 이 차시는 지식보다 방법을 먼저 줍니다: 눈으로 본 것과 짐작한 것을 가르고, 짐작에는 까닭을 붙입니다.
# 시대 이름은 2차시부터 배우므로 아이가 읽는 글에 쓰지 않습니다. 유물 이름도 아이에게는 알려 주지 않습니다.
schema_version: 1
id: 5-2/1/01
title: 고인돌, 누가 어떻게?
tagline: 단원의 첫 시간입니다. 고인돌과 이름을 감춘 유물 두 점을 보며, 본 것과 짐작한 것을 가르고 짐작에 까닭을 붙이는 방법을 먼저 익힙니다.
status: draft

objectives:
  - 사진이나 물건을 보고 눈으로 본 것과 짐작한 것을 가려 말한다.
  - 본 것을 까닭으로 들어 옛사람이 무엇을 했는지 짐작해 쓴다.
  - 유적과 유물을 예를 들어 구분한다.

prepare:
  - item: 붙임쪽지
    qty: 한 사람에 1장
  - item: 페이퍼크래프트 조각 (수업 전에 오려 둔 것)
    qty: 모둠마다 1벌

sensitivity:
  level: none

terms:
  new:
    - term: 고인돌
      meaning: 큰 돌을 받침돌 위에 얹어 만든 옛사람의 무덤
      facts: [f1, f2]
    - term: 덮개돌
      meaning: 고인돌의 맨 위에 얹은 크고 넓은 돌
      facts: [f3]
    - term: 받침돌
      meaning: 고인돌에서 덮개돌을 아래에서 받치는 돌
      facts: [f1]
    - term: 추론
      meaning: 아는 것을 근거로 삼아 모르는 것을 짐작하는 일
      facts: [f15]
    - term: 유적
      meaning: 옛사람이 남긴 자취 가운데 무덤이나 집터처럼 옮길 수 없는 것
      facts: [f13]
    - term: 유물
      meaning: 옛사람이 남긴 물건 가운데 그릇이나 도구처럼 옮길 수 있는 것
      facts: [f14]

facts:
  - id: f1
    claim: 고인돌은 큰 바위 아래를 받침돌이 받치고 있는 것으로, 한자로는 지석묘라고 부른다.
    sources:
      - name: 국립중앙박물관
        title: "[광주]‘사진으로 본 고인돌의 세계’ 특별전시 개최"
        url: https://www.museum.go.kr/MUSEUM/contents/M0701040000.do?schM=view&catCustomType=post&catId=93&arcId=2872
        quote: 고인돌은 큰 바위 아래에 받침돌이 있는 것으로 한자로는 ‘지석묘支石墓’라 한다.
        accessed: "2026-11-19"
  - id: f2
    claim: 고인돌은 무덤이다.
    sources:
      - name: 국립중앙박물관
        title: "[순회전시] 한국의 청동기문화 특별전"
        url: https://www.museum.go.kr/MUSEUM/contents/M0202010000.do?schM=view&menuId=specialGallery&listType=list&exhiSpThemId=3802
        quote: 고인돌은 한국의 요녕식동검문화에서만 볼 수 있는 특징적인 무덤이다.
        accessed: "2026-11-19"
  - id: f3
    claim: 고인돌의 위쪽에 얹힌 큰 돌을 덮개돌이라고 부른다.
    sources:
      # 박물관 글은 덮개돌을 따로 풀이하지 않고 위쪽 돌을 가리키는 이름으로 씁니다. 사실 대조 때 사전 풀이를 하나 더 붙이면 좋습니다.
      - name: 국립중앙박물관
        title: "[광주]‘사진으로 본 고인돌의 세계’ 특별전시 개최"
        url: https://www.museum.go.kr/MUSEUM/contents/M0701040000.do?schM=view&catCustomType=post&catId=93&arcId=2872
        quote: 또한 덮개돌 위를 갈아 만든 구멍, 소위 성혈을 통해 소원을 빌기도 하였다.
        accessed: "2026-11-19"
  - id: f4
    claim: 우리나라에서 확인된 고인돌은 약 3만 기가 넘는다.
    sources:
      - name: 국립중앙박물관
        title: "[광주]‘사진으로 본 고인돌의 세계’ 특별전시 개최"
        url: https://www.museum.go.kr/MUSEUM/contents/M0701040000.do?schM=view&catCustomType=post&catId=93&arcId=2872
        quote: 약 3만기 이상이 확인되고 있으며, 형태와 구조가 매우 다양한 편이다.
        accessed: "2026-11-19"
  - id: f6
    claim: 국립중앙박물관 전시 설명은 농사짓는 마을에서 권위와 권력을 얻은 우두머리를 기억하려고 사람들이 고인돌 같은 큰 기념물을 만들었다고 본다.
    sources:
      - name: 국립중앙박물관
        title: 선사·고대관 청동기 전시실 소개
        url: https://www.museum.go.kr/MUSEUM/contents/M0201030300.do?showHallId=760&showroomCode=DM0004
        quote: 우두머리의 역할은 점점 더 중요해져 권위와 권력을 갖게 되었다. 사람들은 그들을 기억하기 위해 고인돌과 같은 큰 기념물을 만들었다.
        accessed: "2026-11-19"
  # f7 은 아직 출처가 없습니다. 이 세션에서는 한국민족문화대백과사전·국가유산포털을 열 수 없었습니다 (보고서 참고).
  - id: f7
    claim: 덮개돌은 받침돌이 묻히도록 흙을 쌓아 비탈을 만들고, 통나무를 깔아 끌어 올린 뒤 흙을 걷어 냈을 것으로 짐작하는 설명이 있다.
  - id: f8
    claim: 국립중앙박물관의 빗살무늬토기(신수22891)는 서울 암사동 집터 유적에서 나왔고, 겉면을 세 부분으로 나누어 부분마다 다른 무늬를 새겼다.
    sources:
      - name: 국립중앙박물관
        title: 빗살무늬토기 (신수22891)
        url: https://www.museum.go.kr/MUSEUM/contents/M0502000000.do?schM=view&searchId=search&relicId=4328
        quote: 이 토기는 서울시 암사동 집터유적에서 출토된 것으로 겉면을 삼등분하고 각각 다른 무늬로 장식하였다.
        accessed: "2026-11-19"
  - id: f9
    claim: 국립중앙박물관은 이 토기 아래쪽에 뚫린 구멍 두 개를 깨진 토기를 임시로 고쳐 쓴 흔적으로 짐작한다.
    sources:
      - name: 국립중앙박물관
        title: 빗살무늬토기 (신수22891)
        url: https://www.museum.go.kr/MUSEUM/contents/M0502000000.do?schM=view&searchId=search&relicId=4328
        quote: 토기 아래쪽에 뚫린 두 개의 구멍은 깨진 토기를 임시로 수리하여 사용했던 흔적으로 추정된다.
        accessed: "2026-11-19"
  - id: f10
    claim: 주먹도끼는 양면이 대칭을 이룬 타원형이나 삼각형이고, 가장자리 전체에 날카로운 날이 있으며 끝이 뾰족하다.
    sources:
      - name: 국립중앙박물관
        title: 주먹도끼 (신수19143)
        url: https://www.museum.go.kr/MUSEUM/contents/M0502000000.do?schM=view&searchId=search&relicId=2486
        quote: 양면이 대칭을 이룬 타원형이거나 삼각형을 하고 있으며, 단면은 볼록렌즈처럼 두툼하다. 가장자리 전체에 날카로운 날이 마련되어 있고, ‘도끼’라는 명칭과는 달리 끝부분이 뾰족하며
        accessed: "2026-11-19"
  - id: f11
    claim: 국립중앙박물관은 주먹도끼가 여러 가지 일에 쓰였고, 주로 큰 동물을 잡아 가르는 데 썼을 것으로 짐작한다.
    sources:
      - name: 국립중앙박물관
        title: 주먹도끼 (신수19143)
        url: https://www.museum.go.kr/MUSEUM/contents/M0502000000.do?schM=view&searchId=search&relicId=2486
        quote: 실제로는 여러 가지 기능을 수행한 ‘다기능연모’였다. 주된 용도는 대형동물의 도살 및 해체용으로 추정되고 있다.
        accessed: "2026-11-19"
  - id: f12
    claim: 국립중앙박물관의 주먹도끼(신수19143)는 경기도 파주에서 나왔고 길이가 17.8cm이다.
    sources:
      - name: 국립중앙박물관
        title: 주먹도끼 (신수19143)
        url: https://www.museum.go.kr/MUSEUM/contents/M0502000000.do?schM=view&searchId=search&relicId=2486
        quote: 길이 17.8cm, 너비 10.2cm, 두께 6.4cm
        accessed: "2026-11-19"
  # f13~f15 는 낱말 풀이입니다. 출처는 표준국어대사전으로 달 계획인데, 이 세션에서는 그 누리집을 열 수 없었습니다 (보고서 참고).
  - id: f13
    claim: 유적은 남아 있는 자취로, 건물이나 무덤처럼 옛사람이 남긴 것 가운데 옮길 수 없는 것을 가리킨다.
  - id: f14
    claim: 유물은 옛사람이 남긴 물건으로, 그릇이나 도구처럼 옮길 수 있는 것을 가리킨다.
  - id: f15
    claim: 추론은 이미 아는 것을 근거로 삼아 다른 것을 미루어 짐작하는 일이다.

