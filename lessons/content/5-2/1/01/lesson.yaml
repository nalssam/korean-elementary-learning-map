flow:
  - phase: 도입
    minutes: 5
    title: 큰 돌 사진을 보고 첫 생각 붙이기
    do:
      - 고인돌 사진을 띄우고 30초 동안 말없이 보게 합니다.
      - 보이는 것을 세 명에게 묻고 칠판 한쪽에 그대로 적습니다.
      - "‘누가, 왜, 어떻게 놓았을까?’ 하고 떠오른 생각을 붙임쪽지에 한 줄씩 적게 합니다."
      - 모둠 기록이가 붙임쪽지를 모아 칠판 다른 쪽에 붙이고, 수업 끝까지 둡니다.
    ask:
      - q: 사진에서 무엇이 보이나요?
        listen_for: 돌의 모양, 크기, 놓인 자리처럼 사진에 있는 것을 말하는지 듣습니다. 짐작이 섞여 나와도 이때는 고치지 않습니다.
    uses: [slides]
    slides: [1, 3]
    facts: [f1, f21]
  - phase: 전개
    minutes: 6
    title: 본 것과 짐작한 것 가르기
    do:
      - 고인돌 그림에서 덮개돌과 받침돌의 이름을 알려 줍니다.
      - 학습지 1쪽 첫 표의 네 문장을 ‘본 것’과 ‘짐작한 것’으로 가르게 합니다.
      - 칠판에 적어 둔 아이들의 말도 같은 기준으로 둘로 나눕니다.
    ask:
      - q: 그건 사진에 보이나요, 머릿속으로 생각한 것인가요?
        listen_for: 사진을 손가락으로 가리킬 수 있으면 본 것이고, 가리킬 수 없으면 짐작이라는 기준을 아이들이 스스로 쓰는지 봅니다.
    uses: [slides, worksheet]
    slides: [4, 6]
    facts: [f1, f3]
  - phase: 전개
    minutes: 13
    title: 종이 고인돌을 세우며 차례 짐작하기
    do:
      - 무거운 덮개돌을 어떻게 올렸을지 먼저 묻고, 나온 생각을 칠판에 적은 뒤 미리 만들어 둔 조각과 차례 카드를 나누어 줍니다.
      - 바닥판의 받침돌 자리에 받침돌 두 개를 세우고 덮개돌을 얹게 합니다 (2분). 조각은 바닥판에 붙이지 않습니다.
      - 차례 카드 네 장을 모둠이 정한 차례로 놓고, 그 차례대로 조각을 움직여 보게 합니다. 차례와 까닭은 학습지 1쪽 표에 적게 합니다 (4분). 카드에 없는 방법이 떠오르면 그것도 적게 합니다.
      - 한 모둠에게 차례와 까닭을 발표하게 하고, 한 가지 짐작을 그림으로 보여 주어 모둠의 차례와 견주게 합니다.
      - 그 짐작이 무엇을 보고 나왔는지 보여 주고, 박물관 설명으로 ‘누가, 왜’의 짐작을 하나 보여 줍니다.
      - 오늘 한 일에 추론이라는 이름을 붙여 줍니다.
    ask:
      - q: 무거운 덮개돌을 받침돌 위로 올리려면 무엇이 있어야 했을까요?
        listen_for: 카드를 나누어 주기 전에 묻습니다. 흙, 통나무, 많은 사람 같은 말이 나오면 “왜 그렇게 생각했나요?”를 한 번 더 묻습니다.
      - q: 이 차례를 그때 곁에서 지켜본 사람이 지금 있을까요?
        listen_for: 아무도 보지 못했으니 짐작이라는 말이 나오는지 듣습니다. 사전도 다른 나라의 사례와 고인돌에 남은 흔적으로 방법을 짐작한다고 덧붙입니다.
    uses: [papercraft, worksheet, slides]
    slides: [7, 13]
    tip: 조각은 수업 전에 오리고 접어 붙여 두어야 이 단계가 시간 안에 끝날 수 있습니다. 모둠 안에서 받침돌 잡기, 조각 움직이기, 기록을 한 사람씩 맡게 합니다.
    facts: [f2, f4, f5, f6, f7, f15, f16, f17, f19, f22]
  - phase: 전개
    minutes: 11
    title: 이름 모를 물건 두 점에게 묻기
    do:
      - 그릇 사진과 돌 도구 사진을 차례로 띄웁니다.
      - 홀수 모둠은 그릇, 짝수 모둠은 돌 도구를 맡아 학습지 2쪽의 표를 채우게 합니다.
      - 그릇 모둠과 돌 도구 모둠이 한 가지씩 말로 들려주게 합니다.
      - 박물관의 짐작을 보여 주고 자기 짐작과 견주게 합니다.
    ask:
      - q: 그릇 아래쪽의 구멍은 왜 뚫었을까요?
        listen_for: 매달려고, 물을 빼려고, 고치려고 같은 여러 짐작이 나올 수 있습니다. 어느 것이든 까닭을 붙였는지만 봅니다.
    uses: [worksheet, slides]
    slides: [14, 17]
    facts: [f8, f9, f10, f11, f12]
  - phase: 정리
    minutes: 5
    title: 유적과 유물, 그리고 이 단원에서 물을 것
    do:
      - 유적과 유물의 뜻을 오늘 본 것에 하나씩 붙여 봅니다.
      - 확인 퀴즈 한 문항을 함께 풉니다.
      - 단원에서 함께 물어볼 질문을 보여 줍니다.
      - 칠판의 붙임쪽지 가운데 하나를 골라 지금 생각과 견주게 합니다.
    uses: [slides, quiz]
    slides: [18, 22]
    facts: [f13, f14, f18]

slides:
  - layout: title
    title: 이 큰 돌, 누가 어떻게?
    subtitle: 옛사람이 남긴 것에게 물어봅시다
    notes: 오늘은 답을 알려 주는 시간이 아니라 묻는 방법을 익히는 시간이라고 먼저 말합니다.
  - layout: picture
    title: 무엇이 보이나요?
    media: dolmen-bugeun
    notes: 30초 동안 말없이 보게 합니다. 이 돌의 이름은 아직 말하지 않습니다.
    facts: [f1]
  - layout: question
    kicker: 첫 생각
    title: 이 큰 돌은 누가, 왜, 어떻게 놓았을까요?
    hint: 떠오른 생각을 붙임쪽지에 한 줄로 적어 봅시다.
    media: dolmen-bugeun
    notes: 붙임쪽지는 모둠 기록이가 모아 칠판에 붙이고 정리 때 다시 봅니다. 맞고 틀림을 말하지 않습니다. 크기를 물으면 덮개돌의 길이가 7.1m, 너비가 5.5m이고 땅에서 꼭대기까지 2.6m라고 알려 줍니다. 자로 교실 벽의 길이와 견주어 보게 해도 됩니다.
    facts: [f21]
  - layout: picture
    title: 이 돌의 이름은 고인돌입니다
    media: dolmen-parts
    caption: 위의 큰 돌은 덮개돌, 아래 돌은 받침돌
    notes: 사진과 그림을 견주어 보고, 덮개돌과 받침돌을 손으로 가리키며 읽게 합니다. 무덤이라는 것은 뒤에서 박물관 설명으로 보여 줍니다.
    facts: [f1, f3]
  - layout: points
    title: 본 것일까요, 짐작일까요?
    points:
      - 덮개돌이 받침돌 위에 얹혀 있다.
      - 여러 사람이 함께 돌을 옮겼다.
      - 덮개돌이 받침돌보다 훨씬 길다.
      - 중요한 사람을 위해 만들었다.
    media: dolmen-bugeun
    notes: 한 문장씩 읽고 본 것이면 손바닥, 짐작이면 주먹을 들게 합니다. 사진에서 손가락으로 가리켜 보게 합니다. 학습지 1쪽 첫 표와 같은 문장입니다.
    facts: [f1]
  - layout: compare
    title: 앞 장 사진에서 가리킬 수 있나요?
    left:
      label: 눈으로 본 것
      points:
        - 덮개돌이 받침돌 위에 얹혀 있다.
        - 덮개돌이 받침돌보다 훨씬 길다.
    right:
      label: 짐작한 것
      points:
        - 여러 사람이 함께 돌을 옮겼다.
        - 중요한 사람을 위해 만들었다.
    notes: 사진에서 손가락으로 가리킬 수 있으면 본 것, 가리킬 수 없으면 짐작이라는 기준을 정리합니다. 짐작이 나쁜 것이 아니라 까닭이 있어야 한다는 말을 덧붙입니다.
    facts: [f1]
  - layout: points
    title: 종이 고인돌을 세워 봅시다
    points:
      - 바닥판의 받침돌 자리에 받침돌 두 개를 세웁니다.
      - 덮개돌을 그 위에 얹습니다.
    media: dolmen-parts
    notes: 이 장에는 2분쯤을 잡았습니다. 조각은 바닥판에 붙이지 않고 찍힌 자리에 세우기만 합니다. 덮개돌을 손으로 얹는 것과 진짜 큰 돌을 얹는 것이 어떻게 다를지 묻습니다.
    facts: [f1, f3]
  - layout: activity
    title: 덮개돌을 올린 차례를 짐작해 봅시다
    instructions:
      - 차례 카드 네 장을 모둠이 정한 차례로 놓습니다.
      - 카드를 놓은 차례대로 조각을 움직여 봅니다.
      - 차례와 그 까닭을 학습지 1쪽에 적습니다.
    minutes: 4
    notes: 받침돌이 쓰러지지 않게 한 사람이 잡아 주게 합니다. 흙 비탈과 통나무는 카드에 따라 놓았다가 치울 수 있는 조각입니다. 차례 카드는 정답을 맞히는 놀이가 아니라 까닭을 말하는 연습입니다.
  - layout: question
    kicker: 모둠 발표
    title: 무거운 덮개돌을 어떻게 올렸을까요?
    hint: 모둠이 정한 차례와 그 까닭을 말해 봅시다.
    notes: 한 모둠만 발표합니다. 다른 모둠은 발표를 듣고 “그 까닭이 사진이나 모형에서 보이나요?”를 묻게 합니다. 카드에 없는 방법을 적은 모둠이 있으면 하나 들어 봅니다.
  - layout: steps
    title: 이렇게 올렸다는 짐작이 있습니다
    steps:
      - label: 하나
        text: 받침돌을 세웁니다.
        media: dolmen-step1
      - label: 둘
        text: 흙과 돌을 쌓아 비탈을 만듭니다.
        media: dolmen-step2
      - label: 셋
        text: 통나무를 깔고 덮개돌을 끌어 올립니다.
        media: dolmen-step3
      - label: 넷
        text: 흙을 걷어 냅니다.
        media: dolmen-step4
    notes: 제목의 ‘짐작’을 꼭 읽어 줍니다. 고창 세계유산 고인돌박물관도 이 차례로 설명하면서 ‘추정된다’고 적었습니다. 받침돌이 높은 이런 고인돌은 통나무를 井자로 쌓아 들어 올렸다는 짐작도 있습니다. 모둠의 차례와 같은지, 모둠이 따로 적은 생각은 어디에 들어갈지 묻습니다.
    facts: [f22, f7, f16, f17]
  - layout: points
    title: 무엇을 보고 이렇게 짐작했을까요?
    points:
      - 어떤 고인돌에서는 덮개돌과 받침돌 사이에 눌린 흙이 나왔습니다.
      - 그래서 흙을 쌓았던 것 같다고 짐작합니다.
    media: dolmen-soil
    notes: 고인돌을 조사한 사람들이 찾은 흔적이라고 읽어 주고, 그림에서 덮개돌과 받침돌 사이의 눌린 흙을 가리킵니다. 본 것(눌려 있는 흙)에서 짐작(흙을 쌓았다)이 나왔다는 것을 앞 장의 기준으로 다시 짚습니다.
    facts: [f19]
  - layout: points
    title: 박물관의 설명을 봅시다
    points:
      - 고인돌은 옛사람의 무덤으로 알려져 있습니다.
      - 우두머리 같은 중요한 사람을 기억하려고 만들었다고 봅니다.
      - 우리나라에서 찾은 고인돌은 3만 기가 넘습니다.
    notes: 첫 생각의 ‘누가, 왜’와 견주게 합니다. 둘째 줄은 박물관의 짐작이고 셋째 줄은 찾아서 센 기록입니다. ‘기’는 고인돌을 세는 말입니다. 시간이 남으면 이렇게 많으니 모두 우두머리의 것이었을지 물어봅니다. 여러 기씩 무리 지어 있어 핏줄로 이어진 사람들의 공동 무덤으로 보는 학자도 있고, 크고 홀로 서 있어 기념물로 세웠다고 보는 고인돌도 있습니다.
    facts: [f2, f4, f5, f6]
  - layout: term
    term: 추론
    example: 큰 덮개돌(본 것) + 혼자서는 들 수 없다(아는 것) → 여러 사람이 함께 옮겼다(짐작)
    notes: 오늘 한 일에 이름을 붙여 줍니다. 본 것에 아는 것을 이어 짐작을 끌어내는 것이 추론입니다.
    facts: [f15]
  - layout: compare
    title: 이 그릇을 살펴봅시다
    left:
      label: 그릇 전체
      points:
        - 바닥과 겉면의 무늬를 봅시다.
      media: pottery-amsa
    right:
      label: 아래쪽을 크게
      points:
        - 구멍을 찾아봅시다.
      media: pottery-holes
    notes: 바닥의 모양, 겉면의 무늬, 아래쪽 구멍을 차례로 가리킵니다. 이 사진에는 구멍이 두 개 보이지만 박물관 누리집의 다른 사진에는 더 보입니다. 아이가 센 대로 말하게 합니다. 겉면의 금은 땅에서 나온 조각을 이어 붙인 자국일 수 있습니다. 박물관이 고쳐 쓴 흔적이라고 본 것은 구멍입니다. 금을 까닭으로 들면 “그 금이 옛날에 생긴 것인지 어떻게 알 수 있을까?”를 되묻습니다. 다음 차시에서 다시 만나는 물건입니다.
    facts: [f8]
  - layout: picture
    title: 이 돌 도구를 살펴봅시다
    media: hand-axe
    caption: 길이 17.8cm
    notes: 전체 모양, 가장자리, 끝을 차례로 가리킵니다. 자로 17.8cm를 재어 보여 주면 크기를 짐작하기 쉽습니다. 이름이 나오면 “그 이름은 다음 시간에 배워요. 지금은 무엇을 보고 알았나요?”로 받습니다.
    facts: [f12]
  - layout: activity
    title: 이름 모를 물건에게 물어봅시다
    instructions:
      - 홀수 모둠은 그릇, 짝수 모둠은 돌 도구를 봅니다.
      - 살펴볼 곳마다 본 것을 먼저 적습니다.
      - 본 것과 짐작 사이에 아는 것을 ‘~하니까’로 적습니다.
    minutes: 6
    notes: 두 물건의 이름은 알려 주지 않습니다. 이름이 나오면 “그 이름은 다음 시간에 배워요. 지금은 무엇을 보고 알았나요?”로 받습니다.
  - layout: compare
    title: 박물관의 짐작과 견주어 봅시다
    left:
      label: 그릇
      points:
        - "본 것: 아래쪽에 작은 구멍이 있다."
        - "짐작: 깨진 곳을 고쳐 쓴 흔적으로 본다."
      media: pottery-amsa
    right:
      label: 돌 도구
      points:
        - "본 것: 끝이 뾰족하고 가장자리에 날이 있다."
        - "짐작: 여러 가지 일에 썼다고 본다."
        - "짐작: 주로 큰 동물을 가르는 데 썼다고 본다."
      media: hand-axe
    notes: 아이들의 짐작과 같아도, 달라도 괜찮습니다. 박물관도 ‘추정된다’고 적었다는 점을 짚습니다.
    facts: [f9, f10, f11]
  - layout: term
    term: 유적
    example: 고인돌은 옛사람이 만든 무덤 자리이니 유적입니다.
    notes: 오늘 본 고인돌에 낱말을 붙여 줍니다. 논밭을 정리하고 길을 내는 과정에서 중장비로 옮겨지거나 부서진 고인돌도 많으니 ‘옮길 수 있나’보다 ‘옛사람이 살거나 일한 자리의 자취인가’로 가리게 합니다.
    facts: [f2, f13, f18]
  - layout: term
    term: 유물
    example: 오늘 본 그릇과 돌 도구는 옛사람이 남긴 물건이니 유물입니다.
    notes: 오늘 본 두 물건에 낱말을 붙여 줍니다. 오늘 본 세 가지는 서로 아주 다른 때에 남긴 것이라고 한마디 덧붙입니다.
    facts: [f14]
  - layout: quiz
    item: 1
    notes: 손을 들어 답하게 합니다. 틀린 답이 나오면 “그건 그릇에서 가리킬 수 있나요?”를 먼저 묻습니다.
  - layout: points
    title: 이 단원에서 함께 물어볼 것
    points:
      - 옛사람은 무엇을 먹고 어디에서 살았을까요?
      - 쓰던 도구는 어떻게 바뀌었을까요?
      - 사람들은 어떻게 모여 나라를 세웠을까요?
      - 무엇을 보고 그렇게 짐작할 수 있을까요?
    notes: 이 단원은 유적과 유물을 보고 옛사람의 생활을 짐작해 가는 단원이라고 소개합니다. 질문만 보여 주고 답은 말하지 않습니다.
  - layout: closing
    title: 처음 생각이 달라졌나요?
    points:
      - 눈으로 본 것과 짐작한 것을 가릅니다.
      - 짐작에는 본 것을 까닭으로 붙입니다.
    notes: 칠판의 붙임쪽지 가운데 하나를 골라 지금이라면 어떻게 고쳐 쓰고 싶은지 듣고 마칩니다.

worksheet:
  title: 옛사람이 남긴 것에게 묻기
  subtitle: 본 것 · 아는 것 · 짐작한 것
  print:
    per: student
    sides: duplex
  pages:
    - heading: 돌에게 묻기
      blocks:
        - type: figure
          media: dolmen-bugeun
          width: half
        - type: prompt
          text: 고인돌 사진을 보고 한 말입니다. 눈으로 본 것인지, 짐작한 것인지 ○표 해 봅시다.
        - type: table
          columns: [말, 눈으로 본 것, 짐작한 것]
          rows:
            - [덮개돌이 받침돌 위에 얹혀 있다., "", ""]
            - [여러 사람이 함께 돌을 옮겼다., "", ""]
            - [덮개돌이 받침돌보다 훨씬 길다., "", ""]
            - [중요한 사람을 위해 만들었다., "", ""]
        - type: prompt
          text: 우리 모둠이 카드를 놓은 차례와 그렇게 놓은 까닭을 적어 봅시다.
        - type: table
          columns: [차례, 카드에 적힌 일, 그렇게 놓은 까닭]
          rows:
            - ["1", "", ""]
            - ["2", "", ""]
            - ["3", "", ""]
            - ["4", "", ""]
        - type: lines
          label: 카드에 없는 방법
          count: 1
    - heading: 물건에게 묻기
      blocks:
        - type: columns
          columns:
            - - type: figure
                media: pottery-amsa
                width: full
            - - type: figure
                media: pottery-holes
                width: full
            - - type: figure
                media: hand-axe
                width: full
        - type: prompt
          text: 맡은 물건의 표를 채워 봅시다.
        - type: example
          parts:
            - label: 본 것
              text: 덮개돌이 아주 크다.
            - label: 아는 것
              text: 큰 돌은 혼자서는 들 수 없으니까
            - label: 짐작
              text: 여러 사람이 함께 옮겼다.
        - type: prompt
          number: false
          text: 그릇 (홀수 모둠)
        - type: table
          columns: [살펴볼 곳, 눈으로 본 것, 아는 것 (~하니까), 짐작한 것]
          rows:
            - [바닥 모양, "", "", ""]
            - [아래쪽 구멍, "", "", ""]
        - type: prompt
          number: false
          text: 돌 도구 (짝수 모둠)
        - type: table
          columns: [살펴볼 곳, 눈으로 본 것, 아는 것 (~하니까), 짐작한 것]
          rows:
            - [전체 모양, "", "", ""]
            - [가장자리와 끝, "", "", ""]
  guide:
    - where: 1쪽 첫 표
      text: 첫째와 셋째 문장은 사진에서 가리킬 수 있으니 본 것이고, 둘째와 넷째는 짐작입니다.
    - where: 1쪽 차례와 까닭 표
      text: 정해진 답이 없습니다. 차례마다 까닭이 붙어 있는지 봅니다. ‘카드에 없는 방법’ 줄에 적은 것도 까닭이 있으면 받아 줍니다.
    - where: 2쪽 표
      text: 정해진 답이 없습니다. 아는 것 칸에 본 것과 짐작을 잇는 말(예. 날카로운 가장자리는 자르는 데 좋으니까)이 들어가면 추론을 한 것입니다.
    - where: 2쪽 그릇의 바닥 모양
      text: 정해진 답이 없습니다. 까닭이 붙었는지만 봅니다.
    - where: 2쪽 그릇의 구멍
      text: 박물관은 깨진 그릇을 임시로 고쳐 쓴 흔적으로 짐작합니다. 아이의 짐작이 달라도 까닭이 있으면 받아 줍니다.
    - where: 2쪽 돌 도구
      text: 박물관은 여러 가지 일에 쓰였고 주로 큰 동물을 잡아 가르는 데 썼다고 짐작합니다. 본보기는 본 것 ‘끝이 뾰족하고 가장자리가 날카롭다’, 아는 것 ‘날카로운 것은 고기를 자를 수 있으니까’, 짐작 ‘동물을 가르는 데 썼다’입니다.
  facts: [f1, f3, f9, f10, f11, f15]

quiz:
  items:
    - type: choice
      q: 옛 그릇을 보고 한 말 가운데 ‘눈으로 본 것’은 무엇인가요?
      choices:
        - 아래쪽에 작은 구멍이 있다.
        - 깨진 곳을 고쳐 썼을 것이다.
        - 물을 담아 두었을 것이다.
      answer: 1
      explain: 구멍은 그릇에서 손가락으로 가리킬 수 있습니다. 나머지 둘은 본 것을 바탕으로 짐작한 말입니다.
      facts: [f9]
    - type: ox
      q: 추론은 까닭 없이 마음대로 상상하는 것이다.
      answer: false
      explain: 추론은 본 것과 아는 것을 근거로 삼아 모르는 것을 짐작하는 일입니다. 그래서 까닭을 함께 말합니다.
      facts: [f15]
    - type: choice
      q: 고인돌이나 집터처럼 옛사람이 살거나 일한 자리에 남은 자취를 무엇이라고 하나요?
      choices:
        - 유물
        - 유적
        - 덮개돌
      answer: 2
      explain: 무덤이나 집터처럼 옛사람이 살거나 일한 자리에 남은 자취는 유적입니다.
      facts: [f13]
    - type: short
      q: 옛사람이 남긴 물건 가운데 그릇이나 도구 같은 것을 무엇이라고 하나요?
      answer: 유물
      accept: [유물., 유물이요, 유물입니다, 유물입니다.]
      explain: 그릇·도구 같은 물건은 유물, 무덤·집터처럼 자리에 남은 자취는 유적입니다.
      facts: [f13, f14]
    - type: ox
      q: "“덮개돌이 받침돌보다 훨씬 길다”는 사진을 보고 짐작한 것이다."
      answer: false
      explain: 사진에서 가리킬 수 있으니 눈으로 본 것입니다.
      facts: [f1, f3]

assets:
  papercraft:
    state: ready
    title: 종이 고인돌 세우기
    module: dolmen-table
    pages: 3
    print:
      per: group
      paper: A4 180g 이상 두꺼운 종이 (1·2쪽)
      materials: [가위, 풀, 자, 볼펜]
      note: 실제 크기(100%)로 인쇄합니다. 페이지에 맞추기를 켜면 조각 크기가 서로 맞지 않습니다. 1·2쪽만 두꺼운 종이에 뽑고, 3쪽은 보통 용지에 뽑아도 됩니다. 수업 전에 조각을 만들어 두고, 바닥판에는 붙이지 않습니다.
    steps:
      - 자르는 선을 따라 조각과 차례 카드를 오립니다.
      - 자를 대고 볼펜으로 접는 선을 꾹 눌러 금을 긋습니다.
      - 그림이 찍힌 쪽이 바깥으로 오게 접는 선을 접습니다.
      - 빗금 친 풀칠 칸에 풀을 바르고 같은 글자끼리 붙여 덮개돌, 받침돌 두 개, 흙 비탈을 만듭니다.
      - 통나무 세 개는 둥글게 말아 같은 글자끼리 붙입니다.
      - 조각은 바닥판에 붙이지 않습니다. 수업 때 바닥판에 찍힌 자리에 올려놓습니다.
    # 도안의 차례 카드 네 장에 찍는 문장 (수업 화면 10번 장과 같은 글)
    texts:
      - 받침돌을 세웁니다.
      - 흙과 돌을 쌓아 비탈을 만듭니다.
      - 통나무를 깔고 덮개돌을 끌어 올립니다.
      - 흙을 걷어 냅니다.
    try_it:
      - 바닥판의 받침돌 자리에 받침돌 두 개를 세우고 덮개돌을 얹어 봅시다.
      - 차례 카드 네 장을 섞은 뒤 모둠이 생각한 차례로 놓아 봅시다.
      - 카드를 놓은 차례대로 조각을 움직여 봅시다. 받침돌이 쓰러지지 않게 한 사람이 잡아 줍시다.
      - 그 차례로 놓은 까닭을 한 문장으로 말해 봅시다.
    reflect:
      - 고인돌을 세우는 모습을 지켜본 사람이 지금 있을까요? 없다면 우리는 무엇을 보고 짐작했나요?
    facts: [f1, f7, f17, f22]
  coloring:
    state: planned
    idea: 우리가 그린 고인돌 그림(dolmen-parts)을 바탕으로 선 그림을 그리고, 찾아볼 것에 덮개돌과 받침돌을 넣는다. 부근리 사진은 CC BY-SA 라 본떠 그리지 않는다.
  making_kit:
    state: skip
    reason: 도입 차시라 본 것과 짐작을 가르는 쓰기가 중심이고, 만들기는 페이퍼크래프트로 이미 합니다.
  escape:
    state: planned
    idea: "한 방: 문장을 본 것과 짐작으로 가르고, 유적과 유물을 나누어야 문이 열린다."
  virtual3d:
