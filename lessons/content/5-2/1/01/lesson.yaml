misconceptions:
  - belief: 짐작은 정답이 없으니 아무렇게나 말해도 된다.
    response: 짐작에도 까닭이 있어야 한다고 말해 줍니다. "그건 무엇을 보고 그렇게 생각했나요?"를 묻고, 본 것을 대면 받아 줍니다.
  - belief: 박물관 설명은 그때 사람이 직접 보고 남긴 기록이다.
    response: 박물관도 남은 것을 보고 짐작했다고 말해 줍니다. 소장품 설명의 '추정된다'라는 말을 보여 주면 됩니다.
  - belief: 큰 돌이 놓여 있으면 모두 고인돌이다.
    response: 받침돌과 덮개돌의 짜임을 보고 가린다고 말해 줍니다. 생김새가 여러 가지라는 것은 4~5차시에서 다시 다룹니다.

assessment:
  look_for: 표의 '그렇게 짐작한 까닭' 칸에 '눈으로 본 것' 칸의 내용이 들어가 있는가
  where: 학습지 1쪽 둘째 표와 2쪽의 두 표

teacher_notes:
  - title: 오늘 쓰는 사진과 유물 (교사만)
    body:
      - 첫 사진은 경기도 연천 양원리 고인돌입니다 (문화재청 사진, 공공누리 제1유형).
      - 그릇은 서울 암사동에서 나온 빗살무늬토기, 돌 도구는 경기도 파주에서 나온 주먹도끼입니다. 둘 다 국립중앙박물관 소장품입니다.
      - 시대 이름과 유물 이름은 2차시부터 배웁니다. 오늘은 아이에게 이름을 말하지 않습니다.
  - title: 고인돌의 생김새와 이름
    body:
      - 박물관 글은 위쪽 돌을 덮개돌, 아래쪽 돌을 받침돌이라고 씁니다. 굄돌이라고도 부르니 아이들이 굄돌이라고 말해도 받아 줍니다.
      - 탁자식, 바둑판식처럼 생김새를 나누는 말은 이 차시에서 다루지 않습니다.
  - title: 덮개돌을 올린 차례
    body:
      - 수업 화면 9번 장의 차례는 여러 짐작 가운데 하나입니다. 다른 차례를 내놓은 모둠도 까닭이 있으면 받아 줍니다.
      - 이 차례의 출처는 사실 대조 때 채워 넣을 예정입니다 (사실 f7).
  - title: 시간이 모자랄 때
    body:
      - 7번 장에서 페이퍼크래프트를 세우는 대신 수업 화면 9번 장의 그림 네 장을 섞어 보여 주고 차례만 짐작하게 할 수 있습니다.
      - 웹 활동 '유적일까, 유물일까'는 다음 시간 시작이나 과제로 쓸 수 있습니다.
