  <path d="M24,318 L300,168 L514,168 L572,318 Z" fill="url(#soil)" stroke="#132c3d" stroke-width="3" stroke-linejoin="round"/>
  <rect x="322" y="168" width="40" height="168" rx="4" fill="none" stroke="#132c3d" stroke-width="2.5" stroke-dasharray="8 6"/>
