  <text x="408" y="128" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="48" font-weight="700" fill="#132c3d" text-anchor="middle" paint-order="stroke" stroke="#fbfaf6" stroke-width="8" stroke-linejoin="round">덮개돌</text>
