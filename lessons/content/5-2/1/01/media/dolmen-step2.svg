<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="t">
  <title id="t">둘째. 받침돌 꼭대기 높이까지 흙과 돌을 쌓아 한쪽이 비탈진 흙 비탈을 만든다. 흙에 가린 받침돌은 점선으로 그렸다.</title>
  <defs>
    <pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f3f0e8"/><circle cx="3" cy="3" r="1.6" fill="#586875"/><circle cx="9" cy="9" r="1.6" fill="#586875"/></pattern>
    <pattern id="earth" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#586875" stroke-width="1.4"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18766b"/></marker>
  </defs>
  <rect x="1.5" y="1.5" width="597" height="377" rx="16" fill="#fbfaf6" stroke="#e4dfd3" stroke-width="3"/>
  <rect x="16" y="318" width="568" height="36" fill="url(#earth)"/><line x1="16" y1="318" x2="584" y2="318" stroke="#132c3d" stroke-width="3"/>
  <path d="M24,318 L300,168 L514,168 L572,318 Z" fill="url(#soil)" stroke="#132c3d" stroke-width="3" stroke-linejoin="round"/>
  <rect x="322" y="168" width="40" height="168" rx="4" fill="none" stroke="#132c3d" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="452" y="168" width="40" height="168" rx="4" fill="none" stroke="#132c3d" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="24" y="150" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="48" font-weight="700" fill="#132c3d" text-anchor="start">흙 비탈</text>
  <line x1="104" y1="164" x2="172" y2="262" stroke="#18766b" stroke-width="3" stroke-linecap="round"/>
  <text x="407" y="104" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="48" font-weight="700" fill="#132c3d" text-anchor="middle">받침돌</text>
  <line x1="386" y1="116" x2="346" y2="162" stroke="#18766b" stroke-width="3" stroke-linecap="round"/>
  <line x1="428" y1="116" x2="468" y2="162" stroke="#18766b" stroke-width="3" stroke-linecap="round"/>
</svg>
