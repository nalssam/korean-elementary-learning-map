# 업데이트 소식. /updates/ 와 첫 화면의 '최근 올라온 자료'에 보입니다 (docs/CONTRACT.md 3절, 형식은 schema/updates.ts).
#
# 한 소식에 한 덩어리를 적습니다. 차례는 아무래도 되고, 사이트는 날짜가 늦은 것부터 보여 줍니다.
#   date     올린 날. "2026-11-21"처럼
#   kind     new(새 자료) · fix(고침) · notice(알림)
#   title    한 줄 제목 (50자까지)
#   body     덧붙이는 말 (적지 않아도 됩니다)
#   lessons  이 소식이 말하는 차시 묶음 id. 적으면 그 차시가 공개된 뒤에야 공개 사이트에 보입니다
#
# 차시를 더하는 PR 에는 명세와 함께 kind: new 소식을 하나 적습니다.

- date: "2026-11-21"
  kind: notice
  title: 사이트 이름을 ‘nalssam의 초등사회콘텐츠 클라우드’로 정했습니다
  body: 교과서 목차, 자료 유형별 모아 보기, 제작 현황, 내 자료함을 새로 만들었습니다. 새 차시와 고친 곳은 이 페이지에 알립니다.

