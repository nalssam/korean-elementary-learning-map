  kind: new
  title: 첫 차시 「이 큰 돌, 누가 어떻게?」를 올렸습니다
  body: 5학년 2학기 1단원 1차시입니다. 수업 화면 22장과 PPTX, 학습지 2쪽, 종이 고인돌, 낱말 카드 6장, 확인 퀴즈 5문항, 웹 활동이 있습니다.
  lessons: ["5-2/1/01"]
